name: Weekly container acceptance

on:
  schedule:
    - cron: "23 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  COMPOSE_PROJECT_NAME: sharpproof-weekly-${{ github.run_id }}-${{ github.run_attempt }}
  SHARPPROOF_CONTAINER_CPU_LIMIT: 4

jobs:
  acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Build the pinned toolchain
        uses: ./.github/actions/build-tooling

      - name: Run full acceptance
        run: >-
          docker compose run --rm tooling acceptance
          -Configuration Release

      - name: Upload weekly evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: weekly-acceptance-${{ github.sha }}-${{ github.run_attempt }}
          path: artifacts
          if-no-files-found: error
          retention-days: 90
