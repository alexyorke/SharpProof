name: Weekly acceptance

on:
  schedule:
    - cron: "23 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup required .NET SDKs
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "8.0.x"
          global-json-file: global.json

      - name: Restore and run the full acceptance cycle
        shell: pwsh
        run: |
          .\scripts\Invoke-SharpProofDotnet.ps1 restore SharpProof.sln
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\eng\acceptance\Verify.ps1 -Configuration Release

      - name: Retain corpus outcome summary
        if: always()
        shell: pwsh
        run: >-
          .\scripts\Invoke-SharpProofGateEvidence.ps1
          -Gate corpus
          -OutputPath artifacts/weekly/corpus.json

      - name: Upload weekly evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: weekly-acceptance-${{ github.run_id }}
          path: artifacts/weekly
          if-no-files-found: error
          retention-days: 90
