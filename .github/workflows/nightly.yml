name: Nightly container soundness gates

on:
  schedule:
    - cron: "17 8 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  SHARPPROOF_CI_PACKAGE_VERSION: ${{ !startsWith(github.ref, 'refs/tags/v') && format('0.0.0-ci.{0}.{1}', github.run_id, github.run_attempt) || '' }}
  COMPOSE_PROJECT_NAME: sharpproof-nightly-${{ github.run_id }}-${{ github.run_attempt }}
  SHARPPROOF_CONTAINER_CPU_LIMIT: 4

jobs:
  soundness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: ./.github/actions/prepare-qualified-packages
        with:
          download-packages: "false"

      - name: Run the locally reproducible nightly profile
        run: docker compose run --rm tooling nightly

      - name: Upload nightly evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nightly-evidence-${{ github.sha }}-${{ github.run_attempt }}
          path: artifacts
          if-no-files-found: error
          retention-days: 30

      - name: Report runner telemetry
        if: always() && hashFiles('.github/actions/runner-telemetry/action.yml') != ''
        uses: ./.github/actions/runner-telemetry
        with:
          mode: report
