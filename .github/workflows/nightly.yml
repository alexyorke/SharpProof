name: Nightly soundness gates

on:
  schedule:
    - cron: "17 8 * * *"
  workflow_dispatch:

jobs:
  fuzz:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup required .NET SDKs
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "8.0.x"
          global-json-file: global.json

      - name: Restore and build
        shell: pwsh
        run: |
          .\scripts\Invoke-SharpProofDotnet.ps1 restore SharpProof.sln
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\scripts\Invoke-SharpProofDotnet.ps1 build SharpProof.sln -c Release --no-restore
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run the contract-declared nightly fuzz budget
        shell: pwsh
        run: |
          $contract = Get-Content .\eng\acceptance\contract.json -Raw | ConvertFrom-Json
          .\scripts\Invoke-SharpProofDotnet.ps1 `
            -MemoryLimitMb $contract.worker.maximumMemoryMiB `
            -TimeoutSeconds $contract.worker.maximumProjectWallSeconds `
            run --project .\Tools\SharpProof.Fuzz\SharpProof.Fuzz.csproj `
            -c Release --no-build -- `
            --cases $contract.fuzz.nightlyCases `
            --seed 23063 `
            --max-parallelism $contract.fuzz.maximumParallelism
