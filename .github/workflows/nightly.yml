name: Nightly container soundness gates

on:
  schedule:
    - cron: "17 8 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  COMPOSE_PROJECT_NAME: sharpproof-nightly-${{ github.run_id }}-${{ github.run_attempt }}
  SHARPPROOF_CONTAINER_CPU_LIMIT: 4

jobs:
  soundness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Build the pinned toolchain
        run: docker compose build tooling

      - name: Kill trusted-boundary mutations
        run: >-
          docker compose run --rm tooling mutation
          -Configuration Release

      - name: Retain fail-closed dependency audit evidence
        run: docker compose run --rm tooling dependency-audit

      - name: Run the complete acceptance cycle
        run: >-
          docker compose run --rm tooling acceptance
          -Configuration Release

      - name: Upload nightly evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nightly-evidence-${{ github.sha }}-${{ github.run_attempt }}
          path: artifacts
          if-no-files-found: error
          retention-days: 30
