name: Canonical container PR gates

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: "41 7 * * 3"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  COMPOSE_PROJECT_NAME: sharpproof-ci-${{ github.run_id }}-${{ github.run_attempt }}
  SHARPPROOF_CONTAINER_CPU_LIMIT: 4

jobs:
  repository-quality:
    uses: ./.github/workflows/quality.yml

  dotnet-api-inventory:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/prepare-qualified-packages
        with:
          download-packages: "false"
      - name: Check pinned .NET API inventory and support evidence
        run: >-
          docker compose run --rm tooling test
          -Target SharpProof.Effects.Test/SharpProof.Effects.Test.csproj
          -TestFilter FullyQualifiedName~DotnetApiInventoryTests
      - name: Require executed test evidence for every modeled catalog facet
        if: ${{ !cancelled() }}
        run: >-
          docker compose run --rm tooling test
          -Target SharpProof.Specs.Test/SharpProof.Specs.Test.csproj
          -TestFilter FullyQualifiedName~ApiSpecRuntimeOracleTests
      - name: Rank API gaps in original corpus targets and samples
        if: ${{ !cancelled() }}
        run: >-
          docker compose run --rm tooling test
          -Target SharpProof.Gates.Test/SharpProof.Gates.Test.csproj
          -TestFilter FullyQualifiedName~ApiUsageRankingTests
      - name: Require executed evidence and usage reports
        if: ${{ !cancelled() }}
        run: |
          test -s artifacts/api-coverage/catalog-test-evidence.json
          test -s artifacts/api-coverage/intrinsic-test-evidence.json
          test -s artifacts/api-coverage/usage-ranking.json
      - name: Publish API coverage summary
        if: always()
        run: |
          if [[ -f artifacts/api-coverage/report.md ]]; then
            cat artifacts/api-coverage/report.md >> "$GITHUB_STEP_SUMMARY"
          fi
          for report in catalog-test-evidence intrinsic-test-evidence usage-ranking; do
            if [[ -f "artifacts/api-coverage/$report.md" ]]; then
              cat "artifacts/api-coverage/$report.md" >> "$GITHUB_STEP_SUMMARY"
            fi
          done
      - name: Upload complete API inventory and delta
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dotnet-api-inventory-${{ github.sha }}-${{ github.run_attempt }}
          path: artifacts/api-coverage
          if-no-files-found: error
          retention-days: 14

  canonical-main:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: ./.github/actions/prepare-qualified-packages
        with:
          download-packages: "false"

      - name: Run the single-build non-Gates PR phases
        run: >-
          docker compose run --rm -e GITHUB_RUN_ID -e GITHUB_RUN_ATTEMPT -e GITHUB_SHA tooling pr
          -SemanticCohort Remaining -TestResultsDirectory artifacts/canonical-remaining

      - name: Upload container gate evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: canonical-main-evidence-${{ github.sha }}-${{ github.run_attempt }}
          path: artifacts
          if-no-files-found: warn
          retention-days: 14

  canonical-gates:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: ./.github/actions/prepare-qualified-packages
        with:
          download-packages: "false"

      - name: Run the complete canonical Gates cohort
        run: >-
          docker compose run --rm -e GITHUB_RUN_ID -e GITHUB_RUN_ATTEMPT -e GITHUB_SHA tooling semantic-tests
          -Configuration Release -SemanticCohort Gates -TestResultsDirectory artifacts/canonical-gates
          -TestFilter 'TestCategory!=Performance&TestCategory!=Coverage&TestCategory!=Corpus'

      - name: Upload Gates cohort and timing evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: canonical-gates-evidence-${{ github.sha }}-${{ github.run_attempt }}
          path: artifacts
          if-no-files-found: error
          retention-days: 14

  self-application:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: ./.github/actions/prepare-qualified-packages
        with:
          download-packages: "false"

      - name: Apply SharpProof to every tracked project
        run: docker compose run --rm tooling self-apply -Configuration Release

  build-and-test:
    if: always() && github.event_name != 'schedule'
    needs: [canonical-main, canonical-gates, self-application, dotnet-api-inventory, repository-quality]
    runs-on: ubuntu-latest
    steps:
      - name: Require successful canonical cohorts and self-application
        env:
          SHARPPROOF_MAIN_RESULT: ${{ needs.canonical-main.result }}
          SHARPPROOF_GATES_RESULT: ${{ needs.canonical-gates.result }}
          SHARPPROOF_SELF_APPLICATION_RESULT: ${{ needs.self-application.result }}
          SHARPPROOF_API_INVENTORY_RESULT: ${{ needs.dotnet-api-inventory.result }}
          SHARPPROOF_QUALITY_RESULT: ${{ needs.repository-quality.result }}
        run: |
          if [[ "$SHARPPROOF_MAIN_RESULT" != success || "$SHARPPROOF_GATES_RESULT" != success || "$SHARPPROOF_SELF_APPLICATION_RESULT" != success || "$SHARPPROOF_API_INVENTORY_RESULT" != success || "$SHARPPROOF_QUALITY_RESULT" != success ]]; then
            echo "Required CI jobs failed: $SHARPPROOF_MAIN_RESULT, $SHARPPROOF_GATES_RESULT, $SHARPPROOF_SELF_APPLICATION_RESULT, $SHARPPROOF_API_INVENTORY_RESULT, $SHARPPROOF_QUALITY_RESULT" >&2
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: ./.github/actions/prepare-qualified-packages
        with:
          download-packages: "false"

      - name: Download non-Gates cohort evidence
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: canonical-main-evidence-${{ github.sha }}-${{ github.run_attempt }}
          path: artifacts/canonical-cohorts/remaining-evidence

      - name: Download Gates cohort evidence
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: canonical-gates-evidence-${{ github.sha }}-${{ github.run_attempt }}
          path: artifacts/canonical-cohorts/gates-evidence

      - name: Reconcile actual discovery and TRX identities
        run: |
          mv artifacts/canonical-cohorts/remaining-evidence/canonical-remaining artifacts/canonical-cohorts/remaining
          mv artifacts/canonical-cohorts/gates-evidence/canonical-gates artifacts/canonical-cohorts/gates
          docker compose run --rm -e GITHUB_RUN_ID -e GITHUB_RUN_ATTEMPT -e GITHUB_SHA tooling canonical-cohort-gate

      - name: Upload combined canonical cohort evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: canonical-cohort-validation-${{ github.sha }}-${{ github.run_attempt }}
          path: artifacts/canonical-cohorts
          if-no-files-found: warn
          retention-days: 14

  exact-sha-security:
    uses: ./.github/workflows/security-reusable.yml
    with:
      run-dependency-review: ${{ github.event_name == 'pull_request' }}
    permissions:
      contents: read
