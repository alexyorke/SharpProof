name: Canonical container PR gates

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: "41 7 * * 3"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  COMPOSE_PROJECT_NAME: sharpproof-ci-${{ github.run_id }}-${{ github.run_attempt }}
  SHARPPROOF_CONTAINER_CPU_LIMIT: 4

jobs:
  repository-quality:
    uses: ./.github/workflows/quality.yml

  # The Remaining cohort saturates a four-CPU runner, so it runs as three parts on
  # separate runners: "worker-a" and "worker-b" reuse the coverage halves;
  # "projects" runs every other Remaining task. Every part builds the full
  # solution with analyzers; build-and-test reconciles all three receipts.
  canonical-main:
    name: canonical-main (${{ matrix.part }})
    outputs:
      worker-a-attempt: ${{ steps.cohort-identity.outputs.worker-a-attempt }}
      worker-b-attempt: ${{ steps.cohort-identity.outputs.worker-b-attempt }}
      projects-attempt: ${{ steps.cohort-identity.outputs.projects-attempt }}
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - part: worker-a
            task-group: WorkerA
          - part: worker-b
            task-group: WorkerB
          - part: projects
            task-group: Projects
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: ./.github/actions/prepare-qualified-packages
        with:
          download-packages: "false"

      # This job is the critical path, so the package phase and the
      # source-only repository gates run in canonical-package, in parallel.
      - name: Run the ${{ matrix.part }} part of the non-Gates semantic PR phases
        run: >-
          docker compose run --rm -e GITHUB_RUN_ID -e GITHUB_RUN_ATTEMPT -e GITHUB_SHA tooling pr
          -SemanticCohort Remaining -TaskGroup ${{ matrix.task-group }}
          -TestResultsDirectory artifacts/canonical-remaining
          -SkipPackageTests -SkipRepositoryGates

      - name: Upload container gate evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: canonical-main-${{ matrix.part }}-evidence-${{ github.sha }}-${{ github.run_attempt }}
          path: artifacts
          if-no-files-found: warn
          retention-days: 14

      - name: Record successful cohort artifact attempt
        id: cohort-identity
        env:
          SHARPPROOF_PART: ${{ matrix.part }}
        run: echo "${SHARPPROOF_PART}-attempt=${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"

      - name: Report runner telemetry
        if: always() && hashFiles('.github/actions/runner-telemetry/action.yml') != ''
        uses: ./.github/actions/runner-telemetry
        with:
          mode: report
          name: ${{ github.job }}-${{ matrix.part }}

  # Keep the initial runner wave for semantic tests and coverage. These shorter
  # independent phases become ready after quality and remain required by the gate.
  canonical-package-partition:
    needs: repository-quality
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        partition: [0, 1, 2, 3]
    outputs:
      partition-0-attempt: ${{ steps.partition-identity.outputs.partition-0-attempt }}
      partition-1-attempt: ${{ steps.partition-identity.outputs.partition-1-attempt }}
      partition-2-attempt: ${{ steps.partition-identity.outputs.partition-2-attempt }}
      partition-3-attempt: ${{ steps.partition-identity.outputs.partition-3-attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: ./.github/actions/prepare-qualified-packages
        with:
          download-packages: "false"

      # The documentation, container contract, layout, and regression checks
      # that pr runs before its build. They read only sources, so they run
      # here, off canonical-main's critical path.
      - name: Run the PR repository gates
        if: matrix.partition == 0
        run: docker compose run --rm tooling repository-gates -Configuration Release

      # The package phase of pr, with the same Release configuration and
      # canonical filter. -Fast skips analyzers in this build only;
      # canonical-main's full solution build enforces them.
      - name: Run the PR package phase
        if: ${{ !cancelled() }}
        run: >-
          docker compose run --rm -e GITHUB_RUN_ID tooling package-tests
          -Configuration Release -Fast
          -PackagePartitionCount 4 -PackagePartition ${{ matrix.partition }}
          -TestFilter 'TestCategory!=Performance&TestCategory!=Coverage&TestCategory!=Corpus'

      - name: Upload package phase and repository gate evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: canonical-package-${{ matrix.partition }}-evidence-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            artifacts/package-partitions
            artifacts/timings
            artifacts/layout-audit
            artifacts/public-api-governance
          if-no-files-found: error
          retention-days: 14

      - name: Record successful package artifact attempt
        id: partition-identity
        env:
          SHARPPROOF_PARTITION: ${{ matrix.partition }}
        run: echo "partition-${SHARPPROOF_PARTITION}-attempt=${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"

      - name: Report runner telemetry
        if: always() && hashFiles('.github/actions/runner-telemetry/action.yml') != ''
        uses: ./.github/actions/runner-telemetry
        with:
          mode: report

  canonical-package:
    if: always() && github.event_name != 'schedule'
    needs: canonical-package-partition
    runs-on: ubuntu-latest
    steps:
      - name: Require every successful package partition
        env:
          PARTITION_RESULT: ${{ needs.canonical-package-partition.result }}
        run: test "$PARTITION_RESULT" = success
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/prepare-qualified-packages
        with:
          download-packages: "false"
      - name: Download package partition 0
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: canonical-package-0-evidence-${{ github.sha }}-${{ needs.canonical-package-partition.outputs.partition-0-attempt }}
          path: artifacts
      - name: Download package partition 1
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: canonical-package-1-evidence-${{ github.sha }}-${{ needs.canonical-package-partition.outputs.partition-1-attempt }}
          path: artifacts
      - name: Download package partition 2
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: canonical-package-2-evidence-${{ github.sha }}-${{ needs.canonical-package-partition.outputs.partition-2-attempt }}
          path: artifacts
      - name: Download package partition 3
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: canonical-package-3-evidence-${{ github.sha }}-${{ needs.canonical-package-partition.outputs.partition-3-attempt }}
          path: artifacts
      - name: Reconcile package discovery and executed identities
        run: docker compose run --rm -e GITHUB_RUN_ID tooling package-partition-gate

  canonical-gates:
    outputs:
      attempt: ${{ steps.cohort-identity.outputs.attempt }}
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: ./.github/actions/prepare-qualified-packages
        with:
          download-packages: "false"

      # -Fast skips analyzers in this build only; canonical-main's full
      # solution build, required through build-and-test, enforces them.
      - name: Run the complete canonical Gates cohort
        run: >-
          docker compose run --rm -e GITHUB_RUN_ID -e GITHUB_RUN_ATTEMPT -e GITHUB_SHA tooling semantic-tests
          -Configuration Release -Fast -SemanticCohort Gates -TestResultsDirectory artifacts/canonical-gates
          -TestFilter 'TestCategory!=Performance&TestCategory!=Coverage&TestCategory!=Corpus'

      - name: Upload Gates cohort and timing evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: canonical-gates-evidence-${{ github.sha }}-${{ github.run_attempt }}
          path: artifacts
          if-no-files-found: error
          retention-days: 14

      - name: Record successful Gates artifact attempt
        id: cohort-identity
        run: echo "attempt=${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"

      - name: Report runner telemetry
        if: always() && hashFiles('.github/actions/runner-telemetry/action.yml') != ''
        uses: ./.github/actions/runner-telemetry
        with:
          mode: report

  self-application:
    needs: repository-quality
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: ./.github/actions/prepare-qualified-packages
        with:
          download-packages: "false"

      - name: Apply SharpProof to every tracked source project
        run: docker compose run --rm tooling self-apply -Configuration Release -SelfApplicationPhase Sources

  self-application-samples:
    needs: repository-quality
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/prepare-qualified-packages
        with:
          download-packages: "false"
      - name: Apply SharpProof through package-backed samples
        run: docker compose run --rm tooling self-apply -Configuration Release -SelfApplicationPhase Samples

  api-coverage:
    needs: repository-quality
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/prepare-qualified-packages
        with:
          download-packages: "false"

      - name: Check pinned .NET API inventory and support evidence
        if: ${{ !cancelled() }}
        run: >-
          docker compose run --rm tooling test
          -Target src/SharpProof.Effects.Tests/SharpProof.Effects.Tests.csproj
          -TestFilter FullyQualifiedName~DotnetApiInventoryTests
      - name: Require executed test evidence for every modeled catalog facet
        if: ${{ !cancelled() }}
        run: >-
          docker compose run --rm tooling test
          -Target src/SharpProof.Specs.Tests/SharpProof.Specs.Tests.csproj
          -TestFilter FullyQualifiedName~ApiSpecRuntimeOracleTests
      - name: Rank API gaps in original corpus targets and samples
        if: ${{ !cancelled() }}
        run: >-
          docker compose run --rm tooling test
          -Target src/SharpProof.Gates.Tests/SharpProof.Gates.Tests.csproj
          -TestFilter FullyQualifiedName~ApiUsageRankingTests
      - name: Require executed evidence and usage reports
        if: ${{ !cancelled() }}
        run: |
          test -s artifacts/api-coverage/catalog-test-evidence.json
          test -s artifacts/api-coverage/intrinsic-test-evidence.json
          test -s artifacts/api-coverage/usage-ranking.json
      - name: Publish API coverage summary
        if: always()
        run: |
          if [[ -f artifacts/api-coverage/report.md ]]; then
            cat artifacts/api-coverage/report.md >> "$GITHUB_STEP_SUMMARY"
          fi
          for report in catalog-test-evidence intrinsic-test-evidence usage-ranking; do
            if [[ -f "artifacts/api-coverage/$report.md" ]]; then
              cat "artifacts/api-coverage/$report.md" >> "$GITHUB_STEP_SUMMARY"
            fi
          done
      - name: Upload complete API inventory and delta
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dotnet-api-inventory-${{ github.sha }}-${{ github.run_attempt }}
          path: artifacts/api-coverage
          if-no-files-found: error
          retention-days: 14

      - name: Report runner telemetry
        if: always() && hashFiles('.github/actions/runner-telemetry/action.yml') != ''
        uses: ./.github/actions/runner-telemetry
        with:
          mode: report

  # Formatting and independent-path reproduction remain required and run in parallel.
  # Independent-path package reproduction rebuilds and packs the solution
  # twice and needs no other job's output. It runs here, beside the canonical
  # jobs, rather than in the package job that every consumer job waits for.
  # Release qualification requires this workflow's exact-commit success on master.
  formatting:
    needs: repository-quality
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/prepare-qualified-packages
        with:
          download-packages: "false"
      - name: Require C#, PowerShell, and shell linting and formatting
        run: docker compose run --rm tooling format-check


  package-reproducibility:
    needs: repository-quality
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: ./.github/actions/prepare-qualified-packages
        with:
          download-packages: "false"

      - name: Require full independent-path managed payload reproducibility
        id: package-reproducibility
        if: ${{ !cancelled() }}
        run: >-
          docker compose run --rm tooling package-reproducibility -Configuration Release

      - name: Summarize managed payload and raw ZIP comparisons separately
        if: ${{ always() && steps.package-reproducibility.outcome != 'skipped' }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          report = json.loads(Path('artifacts/reproducibility/report.json').read_text())
          archives = report.get('archiveComparisons', [])
          equal_archives = sum(item['equal'] for item in archives)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
              summary.write('### Independent-path package reproduction\n\n')
              summary.write(f"Source: `{report['sourceCommit']}`; scope: `{report['scope']}`.\n\n")
              summary.write(f"Managed first-party DLL/PDB payloads: equal=`{report['managedPayloadsEqual']}`, entries=`{report['managedPayloadCount']}`. Equality is required.\n\n")
              summary.write(f"Raw NuGet/SNuGet ZIP archives: equal=`{report['packageBytesEqual']}`, identical archives=`{equal_archives}/{len(archives)}`. Raw ZIP equality is measured separately and is not claimed by managed payload equality.\n")
          PY

      - name: Upload the independent-path reproduction report
        if: ${{ always() && steps.package-reproducibility.outcome != 'skipped' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-reproducibility-${{ github.run_id }}-${{ github.sha }}
          path: artifacts/reproducibility/report.json
          if-no-files-found: error

      - name: Report runner telemetry
        if: always() && hashFiles('.github/actions/runner-telemetry/action.yml') != ''
        uses: ./.github/actions/runner-telemetry
        with:
          mode: report

  build-and-test:
    if: always() && github.event_name != 'schedule'
    needs: [canonical-main, canonical-package, canonical-gates, self-application, self-application-samples, api-coverage, formatting, package-reproducibility, repository-quality]
    runs-on: ubuntu-latest
    steps:
      - name: Require successful canonical cohorts and self-application
        env:
          SHARPPROOF_MAIN_RESULT: ${{ needs.canonical-main.result }}
          SHARPPROOF_PACKAGE_RESULT: ${{ needs.canonical-package.result }}
          SHARPPROOF_GATES_RESULT: ${{ needs.canonical-gates.result }}
          SHARPPROOF_SAMPLES_RESULT: ${{ needs.self-application-samples.result }}
          SHARPPROOF_API_RESULT: ${{ needs.api-coverage.result }}
          SHARPPROOF_FORMATTING_RESULT: ${{ needs.formatting.result }}
          SHARPPROOF_SELF_APPLICATION_RESULT: ${{ needs.self-application.result }}
          SHARPPROOF_REPRODUCIBILITY_RESULT: ${{ needs.package-reproducibility.result }}
          SHARPPROOF_QUALITY_RESULT: ${{ needs.repository-quality.result }}
        run: |
          if [[ "$SHARPPROOF_SAMPLES_RESULT" != success || "$SHARPPROOF_API_RESULT" != success || "$SHARPPROOF_FORMATTING_RESULT" != success ]]; then
            echo "Samples, API coverage, or formatting did not succeed." >&2
            exit 1
          fi
          if [[ "$SHARPPROOF_QUALITY_RESULT" != success ]]; then
            echo "Repository quality failed: $SHARPPROOF_QUALITY_RESULT" >&2
            exit 1
          fi
          if [[ "$SHARPPROOF_MAIN_RESULT" != success || "$SHARPPROOF_PACKAGE_RESULT" != success || "$SHARPPROOF_GATES_RESULT" != success || "$SHARPPROOF_SELF_APPLICATION_RESULT" != success || "$SHARPPROOF_REPRODUCIBILITY_RESULT" != success ]]; then
            echo "Canonical jobs (package includes repository gates), self-application and API inventory, or package reproducibility and formatting failed: $SHARPPROOF_MAIN_RESULT, $SHARPPROOF_PACKAGE_RESULT, $SHARPPROOF_GATES_RESULT, $SHARPPROOF_SELF_APPLICATION_RESULT, $SHARPPROOF_REPRODUCIBILITY_RESULT" >&2
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The cohort gate reads only downloaded evidence and Git identity. This
      # job is on every PR's critical path, so it runs the gate on the
      # catalog-pinned PowerShell archive (the same verified binary the
      # tooling image installs) instead of building the full tooling image.
      - name: Install the catalog-pinned PowerShell
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/powershell.tar.gz"
          root="${RUNNER_TEMP}/powershell"
          curl --fail --location --retry 3 --silent --show-error \
            --output "${archive}" "$(jq -r .powershell.archiveUrl eng/container/toolchain.json)"
          echo "$(jq -r .powershell.archiveSha256 eng/container/toolchain.json)  ${archive}" |
            sha256sum --check --strict
          mkdir -p "${root}"
          tar -xzf "${archive}" -C "${root}"
          chmod +x "${root}/pwsh"
          test "$("${root}/pwsh" -Version)" = \
            "PowerShell $(jq -r .powershell.version eng/container/toolchain.json)"
          echo "SHARPPROOF_PWSH=${root}/pwsh" >> "${GITHUB_ENV}"

      - name: Download non-Gates cohort Worker A part evidence
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: canonical-main-worker-a-evidence-${{ github.sha }}-${{ needs.canonical-main.outputs.worker-a-attempt }}
          path: artifacts/canonical-cohorts/remaining-worker-a-evidence

      - name: Download non-Gates cohort Worker B part evidence
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: canonical-main-worker-b-evidence-${{ github.sha }}-${{ needs.canonical-main.outputs.worker-b-attempt }}
          path: artifacts/canonical-cohorts/remaining-worker-b-evidence

      - name: Download non-Gates cohort Projects part evidence
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: canonical-main-projects-evidence-${{ github.sha }}-${{ needs.canonical-main.outputs.projects-attempt }}
          path: artifacts/canonical-cohorts/remaining-projects-evidence

      - name: Download Gates cohort evidence
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: canonical-gates-evidence-${{ github.sha }}-${{ needs.canonical-gates.outputs.attempt }}
          path: artifacts/canonical-cohorts/gates-evidence

      # The three Remaining parts hold disjoint task directories. Each keeps its
      # receipt as canonical-cohort.<part>.json, and the gate merges them.
      - name: Reconcile actual discovery and TRX identities
        env:
          SHARPPROOF_COHORT_ARTIFACT_ATTEMPTS: >-
            {"Remaining":{"canonical-cohort.worker-a.json":"${{ needs.canonical-main.outputs.worker-a-attempt }}","canonical-cohort.worker-b.json":"${{ needs.canonical-main.outputs.worker-b-attempt }}","canonical-cohort.projects.json":"${{ needs.canonical-main.outputs.projects-attempt }}"},"Gates":{"canonical-cohort.json":"${{ needs.canonical-gates.outputs.attempt }}"}}
        run: |
          set -euo pipefail
          remaining=artifacts/canonical-cohorts/remaining
          mkdir -p "${remaining}"
          for part in worker-a worker-b projects; do
            source="artifacts/canonical-cohorts/remaining-${part}-evidence/canonical-remaining"
            mv "${source}/canonical-cohort.json" "${remaining}/canonical-cohort.${part}.json"
            for task in "${source}"/*/; do
              if [[ -e "${remaining}/$(basename "${task}")" ]]; then
                echo "Multiple Remaining parts ran task $(basename "${task}")." >&2
                exit 1
              fi
              mv "${task}" "${remaining}/"
            done
          done
          mv artifacts/canonical-cohorts/gates-evidence/canonical-gates artifacts/canonical-cohorts/gates
          "${SHARPPROOF_PWSH}" -NoLogo -NoProfile -File eng/scripts/Invoke-SharpProofCanonicalCohortGate.ps1

      - name: Upload combined canonical cohort evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: canonical-cohort-validation-${{ github.sha }}-${{ github.run_attempt }}
          path: artifacts/canonical-cohorts
          if-no-files-found: warn
          retention-days: 14

  exact-sha-security:
    uses: ./.github/workflows/security-reusable.yml
    with:
      run-dependency-review: ${{ github.event_name == 'pull_request' }}
    permissions:
      contents: read
