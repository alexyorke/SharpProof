name: CI/CD

on:
  push:
    branches: [master]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup required .NET SDKs
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
          global-json-file: global.json

      - name: Restore dependencies
        shell: pwsh
        run: .\scripts\Invoke-SharpProofDotnet.ps1 restore SharpProof.sln

      - name: Verify maintained documentation
        shell: pwsh
        run: .\scripts\Generate-Readme.ps1 -Verify

      - name: Run the acceptance contract
        shell: pwsh
        run: .\eng\acceptance\Verify.ps1 -Configuration Release

      - name: Package NuGet packages
        shell: pwsh
        run: |
          $expectedProjects = @(
            'SharpProof.Attributes/SharpProof.Attributes.csproj',
            'SharpProof.Package/SharpProof.Package.csproj',
            'SharpProof.Verifier.Win-x64/SharpProof.Verifier.Win-x64.csproj'
          )
          $manifest = Get-Content scripts/package-projects.json -Raw | ConvertFrom-Json
          if ($manifest.schemaVersion -ne 1 -or
              (@($manifest.projects) -join '|') -ne
              ($expectedProjects -join '|')) {
            throw 'Package manifest must contain the exact dependency-ordered three-package graph.'
          }
          foreach ($project in $manifest.projects) {
            .\scripts\Invoke-SharpProofDotnet.ps1 pack $project --configuration Release --no-build --output nupkgs
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

          .\scripts\Test-SharpProofPackageConsumers.ps1 `
            -PackageSource nupkgs `
            -ValidatePackageSourceOnly
          Get-ChildItem nupkgs -File -Filter '*.nupkg' |
            Get-FileHash -Algorithm SHA256 |
            Sort-Object Path |
            Format-Table -AutoSize

      - name: Upload NuGet artifact
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: nupkgs/*.nupkg
          if-no-files-found: error
