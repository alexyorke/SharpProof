name: Canonical container PR gates

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: "41 7 * * 3"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  SHARPPROOF_CI_PACKAGE_VERSION: ${{ !startsWith(github.ref, 'refs/tags/v') && format('0.0.0-ci.{0}.{1}', github.run_id, github.run_attempt) || '' }}
  COMPOSE_PROJECT_NAME: sharpproof-ci-${{ github.run_id }}-${{ github.run_attempt }}
  SHARPPROOF_CONTAINER_CPU_LIMIT: 4

jobs:
  repository-quality:
    uses: ./.github/workflows/quality.yml

  # Enforce the full solution and every build analyzer once. Test partitions
  # build their own dependency closures in parallel with this required lane.
  canonical-build:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: ./.github/actions/prepare-qualified-packages
        with:
          download-packages: "false"

      - name: Build the complete Release solution with analyzers
        run: docker compose run --rm tooling build -Configuration Release -Target SharpProof.slnx

      - name: Report runner telemetry
        if: always() && hashFiles('.github/actions/runner-telemetry/action.yml') != ''
        uses: ./.github/actions/runner-telemetry
        with:
          mode: report

  # The Remaining cohort saturates a four-CPU runner, so it runs as three parts on
  # separate runners. Every part builds only its test dependency closure.
  canonical-main:
    name: canonical-main (${{ matrix.part }})
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - part: worker-a
            task-group: WorkerA
          - part: worker-b
            task-group: WorkerB
          - part: projects
            task-group: Projects
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: ./.github/actions/prepare-qualified-packages
        with:
          download-packages: "false"

      # Package tests and source-only repository gates run in canonical-package.
      # -Fast skips analyzers only here; canonical-build enforces all of them.
      - name: Run the ${{ matrix.part }} part of the non-Gates semantic PR phases
        run: >-
          docker compose run --rm -e GITHUB_RUN_ID -e GITHUB_RUN_ATTEMPT -e GITHUB_SHA tooling semantic-tests
          -Configuration Release -Fast
          -SemanticCohort Remaining -TaskGroup ${{ matrix.task-group }}
          -TestResultsDirectory artifacts/canonical-remaining
          -TestFilter 'TestCategory!=Performance&TestCategory!=Coverage&TestCategory!=Corpus'

      - name: Upload container gate evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: canonical-main-${{ matrix.part }}-evidence-${{ github.sha }}-${{ github.run_attempt }}
          path: artifacts
          if-no-files-found: warn
          retention-days: 14

      - name: Report runner telemetry
        if: always() && hashFiles('.github/actions/runner-telemetry/action.yml') != ''
        uses: ./.github/actions/runner-telemetry
        with:
          mode: report
          name: ${{ github.job }}-${{ matrix.part }}

  canonical-package:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    env:
      # Match the constrained coverage envelope and leave room for runner services.
      SHARPPROOF_CONTAINER_MEMORY_LIMIT: 12g
      SHARPPROOF_TMPFS_SIZE: 4g
    strategy:
      fail-fast: false
      matrix:
        partition: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: ./.github/actions/prepare-qualified-packages
        id: tooling
        with:
          download-packages: "false"

      # The source-only checks that pr runs before its build.
      - name: Check documentation links and repository layout
        if: matrix.partition == 0
        run: |
          docker compose run --rm tooling docs
          docker compose run --rm tooling layout

      # The package phase of pr, with the same Release configuration and
      # canonical filter. -Fast skips analyzers in this build only;
      # canonical-build's full solution build enforces them.
      - name: Run the PR package phase
        if: ${{ !cancelled() && steps.tooling.outcome == 'success' }}
        run: >-
          docker compose run
          --name "${COMPOSE_PROJECT_NAME}-canonical-package-${{ matrix.partition }}"
          -e GITHUB_RUN_ID tooling package-tests
          -Configuration Release -Fast
          -PackagePartitionCount 4 -PackagePartition ${{ matrix.partition }}
          -TestFilter 'TestCategory!=Performance&TestCategory!=Coverage&TestCategory!=Corpus'

      - name: Record package container termination
        if: always()
        run: |
          task_container="${COMPOSE_PROJECT_NAME}-canonical-package-${{ matrix.partition }}"
          trap 'docker rm --force "$task_container" >/dev/null 2>&1 || true' EXIT
          state_dir="${RUNNER_TEMP}/sharpproof-container-state"
          mkdir -p "$state_dir"
          if docker inspect --format \
            '{"exitCode":{{.State.ExitCode}},"oomKilled":{{.State.OOMKilled}},"error":{{json .State.Error}}}' \
            "$task_container" > "${state_dir}/canonical-package.json"; then
            cat "${state_dir}/canonical-package.json"
          else
            printf '{"available":false}\n' > "${state_dir}/canonical-package.json"
          fi

      - name: Upload package container termination
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: canonical-package-container-${{ matrix.partition }}-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/sharpproof-container-state/*.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload package phase evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: canonical-package-${{ matrix.partition }}-evidence-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            artifacts/timings
            artifacts/layout-audit
          if-no-files-found: warn
          retention-days: 14

      - name: Report runner telemetry
        if: always() && hashFiles('.github/actions/runner-telemetry/action.yml') != ''
        uses: ./.github/actions/runner-telemetry
        with:
          mode: report

  canonical-gates:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - part: corpus
            task-group: GatesCorpus
          - part: shards
            task-group: GatesShards
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: ./.github/actions/prepare-qualified-packages
        with:
          download-packages: "false"

      # -Fast skips analyzers in this build only; canonical-build's full
      # solution build, required through build-and-test, enforces them.
      - name: Run the ${{ matrix.part }} part of the canonical Gates cohort
        run: >-
          docker compose run --rm -e GITHUB_RUN_ID -e GITHUB_RUN_ATTEMPT -e GITHUB_SHA tooling semantic-tests
          -Configuration Release -Fast -SemanticCohort Gates -TaskGroup ${{ matrix.task-group }} -TestResultsDirectory artifacts/canonical-gates
          -TestFilter 'TestCategory!=Performance&TestCategory!=Coverage&TestCategory!=Corpus'

      - name: Upload Gates cohort and timing evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: canonical-gates-${{ matrix.part }}-evidence-${{ github.sha }}-${{ github.run_attempt }}
          path: artifacts
          if-no-files-found: error
          retention-days: 14

      - name: Report runner telemetry
        if: always() && hashFiles('.github/actions/runner-telemetry/action.yml') != ''
        uses: ./.github/actions/runner-telemetry
        with:
          mode: report
          name: ${{ github.job }}-${{ matrix.part }}

  self-application:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: ./.github/actions/prepare-qualified-packages
        with:
          download-packages: "false"

      - name: Apply SharpProof to every tracked source project
        run: docker compose run --rm tooling self-apply -Configuration Release -SelfApplicationPhase Sources

  self-application-samples:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/prepare-qualified-packages
        with:
          download-packages: "false"
      - name: Apply SharpProof through package-backed samples
        run: docker compose run --rm tooling self-apply -Configuration Release -SelfApplicationPhase Samples

  api-coverage:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/prepare-qualified-packages
        with:
          download-packages: "false"

      - name: Check pinned .NET API inventory and support evidence
        if: ${{ !cancelled() }}
        run: >-
          docker compose run --rm tooling test
          -Target src/SharpProof.Effects.Tests/SharpProof.Effects.Tests.csproj
          -TestFilter FullyQualifiedName~DotnetApiInventoryTests
      - name: Require executed test evidence for every modeled catalog facet
        if: ${{ !cancelled() }}
        run: >-
          docker compose run --rm tooling test
          -Target src/SharpProof.Specs.Tests/SharpProof.Specs.Tests.csproj
          -TestFilter FullyQualifiedName~ApiSpecRuntimeOracleTests
      - name: Require executed evidence reports
        if: ${{ !cancelled() }}
        run: |
          test -s artifacts/api-coverage/catalog-test-evidence.json
          test -s artifacts/api-coverage/intrinsic-test-evidence.json
      - name: Publish API coverage summary
        if: always()
        run: |
          for report in catalog-test-evidence intrinsic-test-evidence; do
            if [[ -f "artifacts/api-coverage/$report.md" ]]; then
              cat "artifacts/api-coverage/$report.md" >> "$GITHUB_STEP_SUMMARY"
            fi
          done
      - name: Upload API test evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: api-test-evidence-${{ github.sha }}-${{ github.run_attempt }}
          path: artifacts/api-coverage
          if-no-files-found: error
          retention-days: 14

      - name: Report runner telemetry
        if: always() && hashFiles('.github/actions/runner-telemetry/action.yml') != ''
        uses: ./.github/actions/runner-telemetry
        with:
          mode: report

  formatting:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/prepare-qualified-packages
        with:
          download-packages: "false"
      - name: Require C#, PowerShell, and shell linting and formatting
        run: docker compose run --rm tooling format-check


  # The single required check: every lane above must succeed.
  build-and-test:
    if: always() && github.event_name != 'schedule'
    needs: [canonical-build, canonical-main, canonical-package, canonical-gates, self-application, self-application-samples, api-coverage, formatting, repository-quality]
    runs-on: ubuntu-latest
    steps:
      - name: Require every lane to succeed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            if [[ "$result" != success ]]; then
              echo "A required lane did not succeed: $RESULTS" >&2
              exit 1
            fi
          done

  exact-sha-security:
    uses: ./.github/workflows/security-reusable.yml
    with:
      run-dependency-review: ${{ github.event_name == 'pull_request' }}
    permissions:
      contents: read
