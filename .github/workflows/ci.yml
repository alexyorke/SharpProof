name: CI

# Every check lives in ./ci.sh; this file only fans its lanes out to runners.
# Run `./ci.sh` (or `./ci.sh <lane>`) to get the same results locally.

on:
  push:
    branches: [master]
  pull_request:
  # Weekly: compile the Windows Z3 payload from source (in the build lane,
  # which skips its cache) and pick up new advisories and broken links.
  schedule:
    - cron: "41 7 * * 3"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  SHARPPROOF_CI_PACKAGE_VERSION: ${{ format('0.0.0-ci.{0}.{1}', github.run_id, github.run_attempt) }}
  COMPOSE_PROJECT_NAME: sharpproof-ci-${{ github.run_id }}-${{ github.run_attempt }}
  SHARPPROOF_CONTAINER_CPU_LIMIT: 4

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      lanes: ${{ steps.lanes.outputs.lanes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: lanes
        run: echo "lanes=$(./ci.sh --list)" >> "$GITHUB_OUTPUT"

  # The only job that may write packages: it runs master's own code, then the
  # lanes pull what it published instead of each racing to push.
  image:
    name: Publish tooling image
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-tooling
        id: tooling
        with:
          publish: "true"
      - name: Attest the tooling image before consumers can use it
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.tooling.outputs.image-name }}
          subject-digest: ${{ steps.tooling.outputs.image-digest }}
          push-to-registry: true
          create-storage-record: false

  lanes:
    name: ${{ matrix.lane }}
    needs: [plan, image]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.image.result != 'failure' }}
    # setup-tooling pulls the tooling image from GHCR. Pull requests run their
    # own code here, so these jobs can read packages but never publish them.
    permissions:
      contents: read
      packages: read
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        lane: ${{ fromJSON(needs.plan.outputs.lanes) }}
    steps:
      # Full history cost 10-50 seconds per lane. Only repository needs it: the
      # package compatibility check reads the API baseline commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: ${{ matrix.lane == 'repository' && '0' || '1' }}
          persist-credentials: false
      - uses: ./.github/actions/setup-tooling
        with:
          # One weekly lane proves the Windows Z3 payload still builds from source.
          from-source: ${{ github.event_name == 'schedule' && matrix.lane == 'build' }}
      - name: ./ci.sh ${{ matrix.lane }}
        env:
          LANE: ${{ matrix.lane }}
          GITHUB_TOKEN: ${{ github.token }}
        run: ./ci.sh "$LANE"
      - name: Upload coverage line hits
        if: hashFiles('artifacts/coverage/*/lines.tsv') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-lines-${{ matrix.lane }}
          path: artifacts/coverage/*/lines.tsv
          retention-days: 14
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lane-${{ matrix.lane }}-${{ github.run_attempt }}
          path: artifacts
          if-no-files-found: warn
          retention-days: 14

  # GitHub-only: compares the dependency graph of the PR's base and head.
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: low
          deny-licenses: GPL-2.0-only, GPL-3.0-only, AGPL-1.0-only, AGPL-3.0-only

  coverage:
    needs: lanes
    # The image job is skipped outside master pushes; without an explicit
    # condition that skip would propagate through lanes and skip this job.
    if: ${{ !cancelled() && needs.lanes.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: coverage-lines-*
          path: artifacts/coverage
      - run: |
          ./ci.sh coverage
          cat artifacts/coverage/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-${{ github.sha }}-${{ github.run_attempt }}
          path: artifacts/coverage
          retention-days: 14

  # The single required check.
  build-and-test:
    if: always()
    needs: [plan, lanes, dependency-review, coverage]
    runs-on: ubuntu-latest
    steps:
      - env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<< "$NEEDS"
          jq -e 'to_entries | all(.value.result == "success"
            or (.key == "dependency-review" and .value.result == "skipped"))' <<< "$NEEDS" > /dev/null
