name: Canonical container PR gates

on:
  push:
    branches: [master]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

env:
  COMPOSE_PROJECT_NAME: sharpproof-ci-${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Build the pinned Linux amd64 toolchain
        run: docker compose build tooling

      - name: Validate the container contract
        run: docker compose run --rm tooling contract

      - name: Build the complete product
        run: >-
          docker compose run --rm tooling build
          -Configuration Release
          -Target SharpProof.sln

      - name: Run isolated performance contract
        run: >-
          docker compose run --rm tooling performance
          -Configuration Release

      - name: Run forced-termination stability probe
        run: >-
          docker compose run --rm tooling test
          -Configuration Release
          -Target SharpProof.Gates.Test/SharpProof.Gates.Test.csproj
          -TestFilter 'FullyQualifiedName~ForcedTerminationDeadlineIsStableAcrossLaunches'

      - name: Run functional and architecture tests
        run: >-
          docker compose run --rm tooling test
          -Configuration Release
          -Target SharpProof.Dev.Tests.slnf
          -TestFilter 'TestCategory!=Performance&TestCategory!=Coverage'

      - name: Run packaged Linux verifier smoke
        run: >-
          docker compose run --rm tooling package-tests
          -Configuration Release
          -TestFilter 'FullyQualifiedName~PackageGraphAndLayoutsAreExact|FullyQualifiedName~VerifierPackageTransitivelySuppliesPortableProduct'

      - name: Upload container gate evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: container-pr-evidence-${{ github.sha }}-${{ github.run_attempt }}
          path: artifacts
          if-no-files-found: warn
          retention-days: 14

      - name: Upload isolated performance evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fast-pr-performance-${{ github.sha }}-${{ github.run_attempt }}
          path: artifacts/ci/performance*.json
          if-no-files-found: error
          retention-days: 14
