name: Fast PR gates

on:
  push:
    branches: [master]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup required .NET SDKs
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "8.0.x"
          global-json-file: global.json

      - name: Restore dependencies
        shell: pwsh
        run: .\scripts\Invoke-SharpProofDotnet.ps1 restore SharpProof.sln

      - name: Verify standard C# formatting
        shell: pwsh
        run: .\scripts\Format-CSharp.ps1 -Verify

      - name: Verify maintained documentation
        shell: pwsh
        run: .\scripts\Generate-Readme.ps1 -Verify

      - name: Verify generated diagnostic descriptors
        shell: pwsh
        run: .\scripts\Generate-DiagnosticDescriptors.ps1 -Verify

      - name: Verify generated C# scalar semantics
        shell: pwsh
        run: .\scripts\Generate-CSharpScalarSemantics.ps1 -Verify

      - name: Verify generated API specification catalog
        shell: pwsh
        run: .\scripts\Generate-ApiSpecCatalog.ps1 -Verify

      - name: Verify generated protocol model
        shell: pwsh
        run: .\scripts\Generate-ProtocolModel.ps1 -Verify

      - name: Verify generated compiler artifact model
        shell: pwsh
        run: .\scripts\Generate-CompilerArtifactModel.ps1 -Verify

      - name: Validate architecture, metadata, and size contract
        shell: pwsh
        run: >-
          .\eng\acceptance\Verify.ps1
          -Configuration Release
          -SkipTests

      - name: Run unit, architecture, protocol, and package-layout tests
        shell: pwsh
        run: >-
          .\scripts\Invoke-SharpProofDotnet.ps1
          -MemoryLimitMb 12288
          -TimeoutSeconds 900
          test SharpProof.Dev.Tests.slnf
          -c Release
          --no-build
          --logger 'console;verbosity=minimal'
