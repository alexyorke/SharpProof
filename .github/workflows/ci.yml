name: CI/CD

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup required .NET SDKs
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
          global-json-file: global.json

      - name: Restore dependencies
        shell: pwsh
        run: .\scripts\Invoke-SharpProofDotnet.ps1 restore SharpProof.sln

      - name: Verify maintained documentation
        shell: pwsh
        run: .\scripts\Generate-Readme.ps1 -Verify

      - name: Run the acceptance contract
        shell: pwsh
        run: .\eng\acceptance\Verify.ps1 -Configuration Release

      - name: Package NuGet packages
        shell: pwsh
        run: |
          $manifest = Get-Content scripts/package-projects.json -Raw | ConvertFrom-Json
          foreach ($project in $manifest.projects) {
            .\scripts\Invoke-SharpProofDotnet.ps1 pack $project --configuration Release --no-build --output nupkgs
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Upload NuGet artifact
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: nupkgs/*.nupkg
