name: CI

on:
  push:
    branches: [master]
  pull_request:
  # Weekly: compile the Windows Z3 payload from source (setup-tooling skips
  # its cache on schedules) and pick up new advisories and broken links.
  schedule:
    - cron: "41 7 * * 3"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  SHARPPROOF_CI_PACKAGE_VERSION: ${{ format('0.0.0-ci.{0}.{1}', github.run_id, github.run_attempt) }}
  COMPOSE_PROJECT_NAME: sharpproof-ci-${{ github.run_id }}-${{ github.run_attempt }}
  SHARPPROOF_CONTAINER_CPU_LIMIT: 4

jobs:
  # Every lane is one container task on its own runner. The test lanes run
  # the semantic and package suites once, with the coverage collector on;
  # the coverage job merges their line hits.
  lanes:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # Dependency audit plus the complete Release solution with analyzers.
          - name: build
            task: security -Configuration Release
          - name: worker-a
            task: coverage -CoveragePart Semantic -TaskGroup WorkerA
            coverage: true
          - name: worker-b
            task: coverage -CoveragePart Semantic -TaskGroup WorkerB
            coverage: true
          - name: projects
            task: coverage -CoveragePart Semantic -TaskGroup Projects
            coverage: true
          - name: gates-corpus
            task: coverage -CoveragePart Semantic -TaskGroup GatesCorpus
            coverage: true
          - name: gates-shards
            task: coverage -CoveragePart Semantic -TaskGroup GatesShards
            coverage: true
          - name: package-0
            task: coverage -CoveragePart Package -PackagePartitionCount 4 -PackagePartition 0
            coverage: true
          - name: package-1
            task: coverage -CoveragePart Package -PackagePartitionCount 4 -PackagePartition 1
            coverage: true
          - name: package-2
            task: coverage -CoveragePart Package -PackagePartitionCount 4 -PackagePartition 2
            coverage: true
          - name: package-3
            task: coverage -CoveragePart Package -PackagePartitionCount 4 -PackagePartition 3
            coverage: true
          - name: self-apply-sources
            task: self-apply -Configuration Release -SelfApplicationPhase Sources
          - name: self-apply-samples
            task: self-apply -Configuration Release -SelfApplicationPhase Samples
          - name: format
            task: format-check
    env:
      # Instrumented lanes stay below the runner's 16 GB of RAM.
      SHARPPROOF_CONTAINER_MEMORY_LIMIT: ${{ matrix.coverage && '12g' || '' }}
      SHARPPROOF_TMPFS_SIZE: ${{ matrix.coverage && '4g' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: ./.github/actions/setup-tooling

      - name: Run ${{ matrix.name }}
        env:
          TASK: ${{ matrix.task }}
        run: |
          read -ra task <<< "$TASK"
          docker compose run --rm -e GITHUB_RUN_ID -e GITHUB_RUN_ATTEMPT -e GITHUB_SHA tooling "${task[@]}"

      - name: Upload coverage line hits
        if: matrix.coverage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-lines-${{ matrix.name }}
          path: artifacts/coverage/lines.tsv
          if-no-files-found: error
          retention-days: 14

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lane-${{ matrix.name }}-${{ github.run_attempt }}
          path: artifacts
          if-no-files-found: warn
          retention-days: 14

  # Short source and image checks share one runner.
  repository:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: ./.github/actions/setup-tooling
        id: setup

      # Build lint on the tooling image prepared above, as compose.yaml's
      # service:tooling context does. `docker compose build lint` would
      # rebuild tooling without the cached Windows Z3 payload.
      - name: Lint (code, docs, spelling, workflows, links)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --file eng/lint/Dockerfile \
            --load \
            --tag "${COMPOSE_PROJECT_NAME}-lint:local" \
            --build-context "canonical_tooling=docker-image://${COMPOSE_PROJECT_NAME}-tooling:local" \
            --progress plain \
            .
          docker compose run --rm -e GITHUB_TOKEN lint

      - name: Check documentation links and repository layout
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: |
          docker compose run --rm tooling docs
          docker compose run --rm tooling layout

      - name: Check pinned .NET API inventory and catalog test evidence
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: |
          docker compose run --rm tooling test \
            -Target src/SharpProof.Effects.Tests/SharpProof.Effects.Tests.csproj \
            -TestFilter FullyQualifiedName~DotnetApiInventoryTests
          docker compose run --rm tooling test \
            -Target src/SharpProof.Specs.Tests/SharpProof.Specs.Tests.csproj \
            -TestFilter FullyQualifiedName~ApiSpecRuntimeOracleTests
          test -s artifacts/api-coverage/catalog-test-evidence.json
          test -s artifacts/api-coverage/intrinsic-test-evidence.json

      - name: Collect isolated Attributes and Fuzz-console coverage
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: docker compose run --rm tooling coverage -CoveragePart Isolated

      - name: Scan the tooling image for vulnerabilities
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: ${{ env.COMPOSE_PROJECT_NAME }}-tooling:local
          grype-version: v0.120.1
          fail-build: true
          severity-cutoff: high
          only-fixed: true
          output-format: json
          output-file: artifacts/toolchain-vulnerabilities.json
          cache-db: false
          config: .grype.yaml

      - name: Publish summaries
        if: always()
        run: |
          for report in artifacts/lint/summary.md \
            artifacts/api-coverage/catalog-test-evidence.md \
            artifacts/api-coverage/intrinsic-test-evidence.md; do
            if [[ -f "$report" ]]; then
              cat "$report" >> "$GITHUB_STEP_SUMMARY"
            fi
          done

      - name: Upload coverage line hits
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-lines-isolated
          path: artifacts/coverage/lines.tsv
          if-no-files-found: error
          retention-days: 14

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: repository-${{ github.run_attempt }}
          path: artifacts
          if-no-files-found: warn
          retention-days: 14

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Reject vulnerable dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: low
          deny-licenses: GPL-2.0-only, GPL-3.0-only, AGPL-1.0-only, AGPL-3.0-only

  # Merging is plain file aggregation, so it runs on the runner's pwsh
  # without building the tooling image.
  coverage:
    needs: [lanes, repository]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: coverage-lines-*
          path: artifacts/coverage

      - name: Merge line coverage
        run: |
          pwsh -NoLogo -NoProfile -File eng/scripts/Invoke-SharpProofCoverage.ps1 -Part Merge
          cat artifacts/coverage/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage summary
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-${{ github.sha }}-${{ github.run_attempt }}
          path: artifacts/coverage
          retention-days: 14

  # The single required check.
  build-and-test:
    if: always()
    needs: [lanes, repository, dependency-review, coverage]
    runs-on: ubuntu-latest
    steps:
      - name: Require every job to succeed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -e 'to_entries | all(.value.result == "success"
            or (.key == "dependency-review" and .value.result == "skipped"))' <<< "$NEEDS" > /dev/null || {
            echo "A required job did not succeed:" >&2
            jq -r 'to_entries[] | "  \(.key): \(.value.result)"' <<< "$NEEDS" >&2
            exit 1
          }
