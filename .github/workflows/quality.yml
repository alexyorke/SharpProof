name: Repository quality

on:
  workflow_call:
  schedule:
    - cron: "47 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  COMPOSE_PROJECT_NAME: sharpproof-quality-${{ github.run_id }}-${{ github.run_attempt }}
  SHARPPROOF_CONTAINER_CPU_LIMIT: 4

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/prepare-qualified-packages
        with:
          download-packages: "false"
      - name: Require all repository quality and link checks
        env:
          GITHUB_TOKEN: ${{ github.token }}
        # Build lint on the tooling image prepared above, as compose.yaml's
        # service:tooling context does. `docker compose build lint` would
        # rebuild tooling without the cached Windows Z3 payload, and older
        # runner Compose versions lose service build contexts under `run --build`.
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --file eng/lint/Dockerfile \
            --load \
            --tag "${COMPOSE_PROJECT_NAME}-lint:local" \
            --build-context "canonical_tooling=docker-image://${COMPOSE_PROJECT_NAME}-tooling:local" \
            --progress plain \
            .
          docker compose run --rm -e GITHUB_TOKEN lint
      - name: Publish quality summary
        if: always()
        run: |
          if [[ -f artifacts/lint/summary.md ]]; then
            cat artifacts/lint/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload quality reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: repository-quality-${{ github.sha }}-${{ github.run_attempt }}
          path: artifacts/lint
          if-no-files-found: warn
          retention-days: 14

      - name: Report runner telemetry
        if: always() && hashFiles('.github/actions/runner-telemetry/action.yml') != ''
        uses: ./.github/actions/runner-telemetry
        with:
          mode: report
