name: Repository quality

on:
  workflow_call:
  schedule:
    - cron: "47 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  COMPOSE_PROJECT_NAME: sharpproof-quality-${{ github.run_id }}-${{ github.run_attempt }}
  SHARPPROOF_CONTAINER_CPU_LIMIT: 4

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/prepare-qualified-packages
        with:
          download-packages: "false"
      - name: Build pinned lint tools over the canonical toolchain
        run: docker compose build lint
      - name: Require workflow, script, documentation, spelling, and API checks
        run: docker compose run --rm lint
      - name: Publish quality summary
        if: always()
        run: |
          if [[ -f artifacts/lint/summary.md ]]; then
            cat artifacts/lint/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload quality reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: repository-quality-${{ github.sha }}-${{ github.run_attempt }}
          path: artifacts/lint
          if-no-files-found: warn
          retention-days: 14
