name: Cross-platform package consumers
on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:
jobs:
  package-consumer:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64 native SMT
            os: windows-latest
            expected-smt: Required
          - name: Linux x64 graceful SMT fallback
            os: ubuntu-latest
            expected-smt: Graceful
          - name: macOS x64 native SMT
            os: macos-15-intel
            expected-smt: Required
    steps:
      - uses: actions/checkout@v4
      - name: Setup required .NET SDKs
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
          global-json-file: global.json
      - name: Build packages and run consumers
        shell: pwsh
        run: >-
          ./scripts/Test-SharpProofPackageConsumers.ps1
          -Configuration Release
          -ExpectedSmt ${{ matrix.expected-smt }}
