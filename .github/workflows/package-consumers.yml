name: Package, consumers, and release

on:
  push:
    branches: [master]
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  COMPOSE_PROJECT_NAME: sharpproof-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
  SHARPPROOF_CONTAINER_CPU_LIMIT: 4

jobs:
  security:
    name: Exact-SHA security
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/security-reusable.yml
    permissions:
      contents: read

  package:
    name: Pack container artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check the tag matches the checked-in package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          prefix="$(sed -n 's:.*<SharpProofVersionPrefix>\(.*\)</SharpProofVersionPrefix>.*:\1:p' SharpProof.Release.props)"
          template="$(sed -n 's:.*<SharpProofPackageVersion>\(.*\)</SharpProofPackageVersion>.*:\1:p' SharpProof.Release.props)"
          version="${template//\$(SharpProofVersionPrefix)/$prefix}"
          test "v${version}" = "${GITHUB_REF_NAME}"

      - uses: ./.github/actions/prepare-qualified-packages
        with:
          download-packages: "false"

      - name: Pack and validate the package graph
        run: docker compose run --rm tooling pack -Configuration Release

      - name: Upload NuGet artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nuget-packages-${{ github.run_id }}-${{ github.sha }}
          path: artifacts/container-packages/*
          if-no-files-found: error
          overwrite: true

  container-verifier:
    name: Canonical Linux analyzer and verifier consumers
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: ./.github/actions/prepare-qualified-packages

      - name: Run analyzer and real verifier consumers
        run: >-
          docker compose run --rm tooling package-consumers
          -Configuration Release
          -PackageSource nupkgs

  portable-consumers:
    name: Portable package consumer (${{ matrix.os }})
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            family: linux
          - os: windows-latest
            family: windows
          - os: macos-latest
            family: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nuget-packages-${{ github.run_id }}-${{ github.sha }}
          path: nupkgs
      - name: Run the portable consumer against the packed packages
        run: >-
          pwsh scripts/Test-SharpProofPortableConsumer.ps1
          -PackageSource nupkgs -OsFamily ${{ matrix.family }}

  publish:
    name: Publish packages
    concurrency:
      group: sharpproof-publish-${{ github.ref_name }}
      cancel-in-progress: false
    if: >-
      startsWith(github.ref, 'refs/tags/v') &&
      github.repository == 'alexyorke/SharpProof'
    needs:
      - security
      - package
      - container-verifier
      - portable-consumers
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'v1.0.0-preview.1' && 'nuget.private-preview' || 'nuget.org' }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nuget-packages-${{ github.run_id }}-${{ github.sha }}
          path: nupkgs

      - name: Exchange GitHub OIDC token for a temporary NuGet key
        if: github.ref_name != 'v1.0.0-preview.1'
        id: nuget-login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Push packages and symbols
        env:
          NUGET_API_KEY: >-
            ${{ github.ref_name == 'v1.0.0-preview.1' &&
                secrets.NUGET_PRIVATE_API_KEY ||
                steps.nuget-login.outputs.NUGET_API_KEY }}
          NUGET_SOURCE: >-
            ${{ github.ref_name == 'v1.0.0-preview.1' &&
                vars.NUGET_PRIVATE_SOURCE ||
                'https://api.nuget.org/v3/index.json' }}
        run: |
          set -euo pipefail
          test -n "${NUGET_SOURCE}"
          test -n "${NUGET_API_KEY}"
          dotnet nuget push "nupkgs/*.nupkg" \
            --source "${NUGET_SOURCE}" \
            --api-key "${NUGET_API_KEY}" \
            --skip-duplicate
