name: Cross-platform package consumers

on:
  push:
    branches: [master]
    tags:
      - "v*"
  pull_request:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Pack exact release artifacts
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup required .NET SDKs
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "8.0.x"
          global-json-file: global.json

      - name: Select the artifact version
        shell: pwsh
        run: |
          [xml]$release = Get-Content SharpProof.Release.props -Raw
          $prefix = [string]$release.Project.PropertyGroup.SharpProofVersionPrefix
          $version =
            ([string]$release.Project.PropertyGroup.SharpProofPackageVersion).
              Replace('$(SharpProofVersionPrefix)', $prefix)
          if ($version -notmatch '^[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z.-]+)?$') {
            throw "Invalid SharpProof artifact version '$version'."
          }
          if ($env:GITHUB_REF.StartsWith('refs/tags/v')) {
            $tagVersion = $env:GITHUB_REF_NAME.Substring(1)
            if ($tagVersion -ne $version) {
              throw (
                "Release tag '$($env:GITHUB_REF_NAME)' does not match the " +
                "checked-in package version '$version'.")
            }
            $tagCommit = (& git rev-parse "$($env:GITHUB_REF_NAME)^{commit}").Trim()
            if ($LASTEXITCODE -ne 0 -or $tagCommit -ne $env:GITHUB_SHA) {
              throw 'The release tag does not identify the checked-out commit.'
            }
            & git merge-base --is-ancestor $env:GITHUB_SHA origin/master
            if ($LASTEXITCODE -ne 0) {
              throw 'Release tags must identify a commit contained in origin/master.'
            }
            $previousTag = switch ($env:GITHUB_REF_NAME) {
              'v1.0.0-preview.1' { $null }
              'v1.0.0-preview.2' { 'v1.0.0-preview.1' }
              'v1.0.0-rc.1' { 'v1.0.0-preview.2' }
              'v1.0.0' { 'v1.0.0-rc.1' }
              default {
                throw "Release tag '$($env:GITHUB_REF_NAME)' is not allowlisted."
              }
            }
            if ($null -ne $previousTag) {
              & git rev-parse --verify "$previousTag^{commit}"
              if ($LASTEXITCODE -ne 0) {
                throw "Required predecessor tag '$previousTag' does not exist."
              }
              & git merge-base --is-ancestor $previousTag $env:GITHUB_SHA
              if ($LASTEXITCODE -ne 0) {
                throw (
                  "Required predecessor tag '$previousTag' is not an " +
                  'ancestor of this release.')
              }
            }
          }
          "SHARPPROOF_RELEASE_VERSION=$version" >> $env:GITHUB_ENV

      - name: Restore dependencies
        shell: pwsh
        run: >-
          .\scripts\Invoke-SharpProofDotnet.ps1
          restore SharpProof.sln
          /p:SharpProofPackageVersion=$env:SHARPPROOF_RELEASE_VERSION

      - name: Build package payloads
        shell: pwsh
        run: >-
          .\scripts\Invoke-SharpProofDotnet.ps1
          build SharpProof.sln
          --configuration Release
          --no-restore
          /p:SharpProofPackageVersion=$env:SHARPPROOF_RELEASE_VERSION

      - name: Pack and validate the three-package graph
        shell: pwsh
        run: |
          $expectedProjects = @(
            'SharpProof.Attributes/SharpProof.Attributes.csproj',
            'SharpProof.Package/SharpProof.Package.csproj',
            'SharpProof.Verifier.Win-x64/SharpProof.Verifier.Win-x64.csproj'
          )
          $manifest = Get-Content scripts/package-projects.json -Raw |
            ConvertFrom-Json
          if ($manifest.schemaVersion -ne 1 -or
              (@($manifest.projects) -join '|') -ne
              ($expectedProjects -join '|')) {
            throw 'Package manifest must contain the exact dependency-ordered three-package graph.'
          }

          foreach ($project in $manifest.projects) {
            .\scripts\Invoke-SharpProofDotnet.ps1 pack $project `
              --configuration Release `
              --no-build `
              --output nupkgs `
              /p:SharpProofPackageVersion=$env:SHARPPROOF_RELEASE_VERSION
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

          .\scripts\Test-SharpProofPackageConsumers.ps1 `
            -PackageSource nupkgs `
            -ValidatePackageSourceOnly

      - name: Generate deterministic SPDX SBOM and release evidence
        shell: pwsh
        run: >-
          .\scripts\New-SharpProofReleaseEvidence.ps1
          -PackageSource nupkgs

      - name: Validate publication-time artifact evidence
        shell: pwsh
        run: >-
          .\scripts\Test-SharpProofReleaseArtifacts.ps1
          -PackageSource nupkgs
          -ExpectedTag "v$env:SHARPPROOF_RELEASE_VERSION"

      - name: Upload exact NuGet artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nuget-packages
          path: nupkgs/*
          if-no-files-found: error

  attest:
    name: Attest canonical package provenance
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/master' ||
       startsWith(github.ref, 'refs/tags/v')) &&
      github.repository == 'alexyorke/SharpProof'
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Download exact NuGet artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nuget-packages
          path: nupkgs

      - name: Attest build provenance
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: |
            nupkgs/*.nupkg
            nupkgs/*.snupkg
            nupkgs/SharpProof.spdx.json
            nupkgs/SharpProof.release.json
            nupkgs/SHA256SUMS

      - name: Attest the package SBOM
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: nupkgs/*.*nupkg
          sbom-path: nupkgs/SharpProof.spdx.json

  package-consumer:
    name: ${{ matrix.name }}
    needs: package
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows package graph, analyzer, and worker
            os: windows-latest
            expected_smt: Required
          - name: Linux package graph and analyzer
            os: ubuntu-latest
            expected_smt: Graceful
          - name: macOS x64 package graph and analyzer
            os: macos-15-intel
            expected_smt: Graceful
          - name: macOS ARM64 package graph and analyzer
            os: macos-15
            expected_smt: Graceful
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup required .NET SDKs
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "8.0.x"
          global-json-file: global.json

      - name: Prime the framework-only package cache
        shell: pwsh
        working-directory: ${{ runner.temp }}
        run: >-
          dotnet restore
          "$env:GITHUB_WORKSPACE/SharpProof.Attributes/SharpProof.Attributes.csproj"
          --source https://api.nuget.org/v3/index.json
          --nologo

      - name: Download exact NuGet artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nuget-packages
          path: nupkgs

      - name: Run consumers against the downloaded local feed
        shell: pwsh
        run: |
          $packageSource = (Resolve-Path ./nupkgs).Path
          ./scripts/Test-SharpProofPackageConsumers.ps1 `
            -Configuration Release `
            -ExpectedSmt '${{ matrix.expected_smt }}' `
            -PackageSource $packageSource

      - name: Run package-backed samples against the same bytes
        shell: pwsh
        run: |
          $packageSource = (Resolve-Path ./nupkgs).Path
          ./scripts/Test-SharpProofSamples.ps1 `
            -Configuration Release `
            -ExpectedSmt '${{ matrix.expected_smt }}' `
            -PackageSource $packageSource

  minimum-sdk-consumer:
    name: Actual SDK 9.0.300 framework consumers
    needs: package
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup the minimum qualified .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "9.0.300"

      - name: Prime the framework-only package cache
        shell: pwsh
        working-directory: ${{ runner.temp }}
        run: >-
          dotnet restore
          "$env:GITHUB_WORKSPACE/SharpProof.Attributes/SharpProof.Attributes.csproj"
          --source https://api.nuget.org/v3/index.json
          --nologo

      - name: Download exact NuGet artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nuget-packages
          path: nupkgs

      - name: Build package-backed framework consumers with SDK 9.0.300
        shell: pwsh
        run: |
          $packageSource = (Resolve-Path ./nupkgs).Path
          ./scripts/Test-SharpProofPackageConsumers.ps1 `
            -Configuration Release `
            -ExpectedSmt Required `
            -PackageSource $packageSource `
            -ConsumerSdkVersion 9.0.300 `
            -FrameworkConsumersOnly

  release-qualification:
    name: Qualify the exact release SHA
    if: >-
      github.event_name == 'push' &&
      startsWith(github.ref, 'refs/tags/v') &&
      github.repository == 'alexyorke/SharpProof'
    needs:
      - package
      - package-consumer
      - minimum-sdk-consumer
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup required .NET SDKs
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "8.0.x"
          global-json-file: global.json

      - name: Restore the exact tagged source
        shell: pwsh
        run: .\scripts\Invoke-SharpProofDotnet.ps1 restore SharpProof.sln

      - name: Run full weekly-equivalent acceptance
        shell: pwsh
        run: |
          .\scripts\Generate-Readme.ps1 -Verify
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\eng\acceptance\Verify.ps1 -Configuration Release

      - name: Run nightly supported-domain fuzzing
        shell: pwsh
        run: >-
          .\scripts\Invoke-SharpProofFuzzCampaign.ps1
          -OutputDirectory artifacts/release-qualification/fuzz

      - name: Kill trusted-boundary mutations
        shell: pwsh
        run: >-
          .\scripts\Test-SharpProofTrustedMutations.ps1
          -Configuration Release
          -OutputPath artifacts/release-qualification/mutations.json

      - name: Retain exact corpus and performance outcomes
        shell: pwsh
        run: |
          .\scripts\Invoke-SharpProofGateEvidence.ps1 `
            -Gate corpus `
            -OutputPath artifacts/release-qualification/corpus.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\scripts\Invoke-SharpProofGateEvidence.ps1 `
            -Gate performance `
            -OutputPath artifacts/release-qualification/performance.json

      - name: Collect and enforce release coverage
        shell: pwsh
        run: |
          .\scripts\Invoke-SharpProofDotnet.ps1 `
            -MemoryLimitMb 12288 `
            -TimeoutSeconds 1200 `
            test SharpProof.Dev.Tests.slnf `
            -c Release `
            --no-build `
            --filter 'TestCategory!=Performance' `
            --collect "XPlat Code Coverage" `
            --results-directory artifacts/release-qualification/coverage
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\scripts\Test-SharpProofCoverage.ps1 `
            -CoverageRoot artifacts/release-qualification/coverage `
            -ComparisonRef HEAD^ `
            -SummaryPath artifacts/release-qualification/coverage.json

      - name: Audit the exact release dependency graph
        shell: pwsh
        run: |
          New-Item `
            -ItemType Directory `
            -Force `
            -Path artifacts/release-qualification |
            Out-Null
          .\scripts\Invoke-SharpProofDotnet.ps1 `
            list SharpProof.sln package `
            --vulnerable `
            --include-transitive |
            Tee-Object `
              -FilePath artifacts/release-qualification/dependency-audit.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Record the qualified tag and commit
        shell: pwsh
        run: |
          $evidence = [pscustomobject][ordered]@{
            schemaVersion = 1
            tag = $env:GITHUB_REF_NAME
            commit = $env:GITHUB_SHA
            acceptance = 'passed'
            corpus = 'passed'
            performance = 'passed'
            fuzz = 'passed'
            mutations = 'passed'
            coverage = 'passed'
            dependencyAudit = 'passed'
          }
          $json = ($evidence | ConvertTo-Json) -replace "`r`n", "`n"
          [IO.File]::WriteAllText(
            'artifacts/release-qualification/qualification.json',
            $json + "`n",
            [Text.UTF8Encoding]::new($false))

      - name: Validate owner-controlled final 1.0 gates
        if: github.ref_name == 'v1.0.0'
        shell: pwsh
        run: >-
          .\scripts\Test-SharpProofHumanReleaseGates.ps1
          -ExpectedCommit $env:GITHUB_SHA

      - name: Upload exact-SHA release qualification evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: release-qualification-${{ github.sha }}
          path: artifacts/release-qualification
          if-no-files-found: error
          retention-days: 90

  publish-private-preview:
    name: Promote preview.1 to the private feed
    if: >-
      github.event_name == 'push' &&
      github.ref_name == 'v1.0.0-preview.1' &&
      github.repository == 'alexyorke/SharpProof'
    needs:
      - package
      - package-consumer
      - minimum-sdk-consumer
      - attest
      - release-qualification
    runs-on: ubuntu-latest
    environment: nuget.private-preview
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup required .NET SDKs
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "8.0.x"
          global-json-file: global.json

      - name: Download the tested private-preview bytes
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nuget-packages
          path: nupkgs

      - name: Validate immutable tag, hashes, SBOM, and provenance identity
        shell: pwsh
        run: >-
          ./scripts/Test-SharpProofReleaseArtifacts.ps1
          -PackageSource nupkgs
          -ExpectedTag '${{ github.ref_name }}'

      - name: Publish the already-tested private-preview bytes
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_PRIVATE_API_KEY }}
          NUGET_SOURCE: ${{ vars.NUGET_PRIVATE_SOURCE }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:NUGET_SOURCE) -or
              [string]::IsNullOrWhiteSpace($env:NUGET_API_KEY)) {
            throw 'The private-preview NuGet source and API key are required.'
          }
          ./scripts/Publish-SharpProofRelease.ps1 `
            -PackageSource nupkgs `
            -Source $env:NUGET_SOURCE `
            -ApiKey $env:NUGET_API_KEY `
            -ReadApiKey $env:NUGET_API_KEY

  publish:
    name: Promote tested packages to public NuGet
    if: >-
      github.event_name == 'push' &&
      (github.ref_name == 'v1.0.0-preview.2' ||
       github.ref_name == 'v1.0.0-rc.1' ||
       github.ref_name == 'v1.0.0') &&
      github.repository == 'alexyorke/SharpProof'
    needs:
      - package
      - package-consumer
      - minimum-sdk-consumer
      - attest
      - release-qualification
    runs-on: ubuntu-latest
    environment: nuget.org
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup required .NET SDKs
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "8.0.x"
          global-json-file: global.json

      - name: Download the tested release bytes
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nuget-packages
          path: nupkgs

      - name: Validate immutable tag, hashes, SBOM, and provenance identity
        shell: pwsh
        run: >-
          ./scripts/Test-SharpProofReleaseArtifacts.ps1
          -PackageSource nupkgs
          -ExpectedTag '${{ github.ref_name }}'

      - name: Exchange GitHub OIDC token for a temporary NuGet key
        id: nuget-login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Publish the already-tested package and symbol bytes
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          $source = 'https://api.nuget.org/v3/index.json'
          ./scripts/Publish-SharpProofRelease.ps1 `
            -PackageSource nupkgs `
            -Source $source `
            -ApiKey $env:NUGET_API_KEY
