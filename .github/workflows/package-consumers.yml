name: Package, consumers, and release qualification

on:
  push:
    branches: [master]
    tags:
      - "v*"
  pull_request:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    name: Exact-SHA security
    uses: ./.github/workflows/security-reusable.yml
    permissions:
      contents: read
      packages: read

  package:
    name: Pack exact container artifacts
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      COMPOSE_PROJECT_NAME: sharpproof-package-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Validate release tag and checked-in version
        shell: pwsh
        run: |
          [xml]$release = Get-Content SharpProof.Release.props -Raw
          $prefix = [string]$release.Project.PropertyGroup.SharpProofVersionPrefix
          $version = ([string]$release.Project.PropertyGroup.SharpProofPackageVersion).
            Replace('$(SharpProofVersionPrefix)', $prefix)
          if ($version -notmatch '^[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z.-]+)?$') {
            throw "Invalid SharpProof package version '$version'."
          }
          if ($env:GITHUB_REF.StartsWith('refs/tags/v')) {
            if ($env:GITHUB_REF_NAME -cne "v$version") {
              throw "Release tag '$env:GITHUB_REF_NAME' does not match '$version'."
            }
            $tagCommit = (& git rev-parse "$($env:GITHUB_REF_NAME)^{commit}").Trim()
            if ($LASTEXITCODE -ne 0 -or $tagCommit -cne $env:GITHUB_SHA) {
              throw 'The release tag does not identify the checked-out commit.'
            }
            & git merge-base --is-ancestor $env:GITHUB_SHA origin/master
            if ($LASTEXITCODE -ne 0) {
              throw 'Release tags must identify a commit contained in origin/master.'
            }
          }

      - name: Build the pinned Linux amd64 toolchain
        run: docker compose build tooling

      - name: Pack, inventory, and validate the exact graph
        run: >-
          docker compose run --rm tooling pack
          -Configuration Release

      - name: Upload exact NuGet artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nuget-packages-${{ github.sha }}-${{ github.run_attempt }}
          path: artifacts/container-packages/*
          if-no-files-found: error

  attest:
    name: Attest canonical package provenance
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')) &&
      github.repository == 'alexyorke/SharpProof'
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Download exact NuGet artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nuget-packages-${{ github.sha }}-${{ github.run_attempt }}
          path: nupkgs

      - name: Attest package and evidence provenance
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: |
            nupkgs/*.nupkg
            nupkgs/*.snupkg
            nupkgs/SharpProof.spdx.json
            nupkgs/SharpProof.release.json
            nupkgs/SHA256SUMS

      - name: Attest package SBOM
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: nupkgs/*.*nupkg
          sbom-path: nupkgs/SharpProof.spdx.json

  portable-consumer:
    name: ${{ matrix.name }}
    needs: package
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux portable analyzer consumers
            os: ubuntu-latest
          - name: Windows portable analyzer consumers
            os: windows-latest
          - name: macOS x64 portable analyzer consumers
            os: macos-15-intel
          - name: macOS ARM64 portable analyzer consumers
            os: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "9.0.316"
          global-json-file: global.json

      - name: Prime portable framework reference packages
        shell: pwsh
        working-directory: ${{ runner.temp }}
        run: >-
          dotnet restore
          "$env:GITHUB_WORKSPACE/SharpProof.Smoke.Net472/SharpProof.Smoke.Net472.csproj"
          --source https://api.nuget.org/v3/index.json
          --nologo

      - name: Download exact NuGet artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nuget-packages-${{ github.sha }}-${{ github.run_attempt }}
          path: nupkgs

      - name: Build netstandard2.0, net8.0, and net472 consumers
        shell: pwsh
        run: >-
          ./scripts/Test-SharpProofPackageConsumers.ps1
          -Configuration Release
          -ExpectedSmt Graceful
          -PackageSource ./nupkgs
          -FrameworkConsumersOnly

  container-verifier:
    name: Canonical Linux packaged verifier
    needs: package
    runs-on: ubuntu-latest
    env:
      COMPOSE_PROJECT_NAME: sharpproof-consumer-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Download exact NuGet artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nuget-packages-${{ github.sha }}-${{ github.run_attempt }}
          path: nupkgs

      - name: Build the pinned toolchain
        run: docker compose build tooling

      - name: Run analyzer and real verifier consumers
        run: >-
          docker compose run --rm tooling package-consumers
          -Configuration Release
          -PackageSource nupkgs

  minimum-sdk-consumer:
    name: SDK 9.0.300 portable framework consumers
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "9.0.300"

      - name: Prime portable framework reference packages
        shell: pwsh
        working-directory: ${{ runner.temp }}
        run: >-
          dotnet restore
          "$env:GITHUB_WORKSPACE/SharpProof.Smoke.Net472/SharpProof.Smoke.Net472.csproj"
          --source https://api.nuget.org/v3/index.json
          --nologo

      - name: Download exact NuGet artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nuget-packages-${{ github.sha }}-${{ github.run_attempt }}
          path: nupkgs

      - name: Build the framework consumers with the actual minimum SDK
        shell: pwsh
        run: >-
          ./scripts/Test-SharpProofPackageConsumers.ps1
          -Configuration Release
          -ExpectedSmt Graceful
          -PackageSource ./nupkgs
          -ConsumerSdkVersion 9.0.300
          -FrameworkConsumersOnly

  release-qualification:
    name: Qualify the exact release SHA in-container
    if: >-
      always() &&
      github.event_name == 'push' &&
      startsWith(github.ref, 'refs/tags/v') &&
      github.repository == 'alexyorke/SharpProof'
    needs:
      - package
      - portable-consumer
      - container-verifier
      - minimum-sdk-consumer
      - security
      - attest
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      COMPOSE_PROJECT_NAME: sharpproof-release-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Require successful upstream gates and an annotated exact tag
        shell: pwsh
        run: |
          $results = @(
            '${{ needs.package.result }}',
            '${{ needs.portable-consumer.result }}',
            '${{ needs.container-verifier.result }}',
            '${{ needs.minimum-sdk-consumer.result }}',
            '${{ needs.security.result }}',
            '${{ needs.attest.result }}')
          if (@($results | Where-Object { $_ -ne 'success' }).Count -ne 0) {
            throw "Upstream release gates were not all successful: $($results -join ', ')."
          }
          $tagRef = "refs/tags/$env:GITHUB_REF_NAME"
          if ((& git cat-file -t $tagRef).Trim() -cne 'tag') {
            throw 'Release tag must be annotated.'
          }
          if ((& git rev-parse "${tagRef}^{commit}").Trim() -cne $env:GITHUB_SHA) {
            throw 'Release tag does not resolve to the exact workflow commit.'
          }

      - name: Resolve the allowlisted release coverage baseline
        shell: pwsh
        run: |
          $selection = ./scripts/Resolve-SharpProofReleaseCoverageBaseline.ps1 `
            -Tag $env:GITHUB_REF_NAME `
            -ReleaseCommit $env:GITHUB_SHA |
            ConvertFrom-Json
          "SHARPPROOF_COVERAGE_COMPARISON_REF=$($selection.coverageBaselineCommit)" >> $env:GITHUB_ENV

      - name: Download exact NuGet artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nuget-packages-${{ github.sha }}-${{ github.run_attempt }}
          path: nupkgs

      - name: Build the pinned toolchain
        run: docker compose build tooling

      - name: Run exact-commit acceptance
        run: >-
          docker compose run --rm tooling acceptance
          -Configuration Release

      - name: Run exact-commit trusted mutations
        run: >-
          docker compose run --rm tooling mutation
          -Configuration Release

      - name: Enforce full release-delta coverage
        run: >-
          docker compose run --rm
          -e SHARPPROOF_COVERAGE_COMPARISON_REF
          tooling coverage -Configuration Release

      - name: Revalidate downloaded packages with a real proof
        run: >-
          docker compose run --rm tooling package-consumers
          -Configuration Release
          -PackageSource nupkgs

      - name: Produce publication dry-run evidence
        run: >-
          docker compose run --rm tooling dev -lc
          'mkdir -p artifacts/release-qualification && pwsh -NoLogo -NoProfile -File ./scripts/Publish-SharpProofRelease.ps1 -PackageSource nupkgs -PlanOnly -PlanOutputPath artifacts/release-qualification/publication-plan.json'

      - name: Bind qualification to container inputs and package hashes
        shell: pwsh
        run: |
          $files = @(
            'eng/container/Dockerfile',
            'eng/container/toolchain.json',
            'compose.yaml') + @(
              Get-ChildItem nupkgs -File |
                Where-Object Name -Match '\.(?:nupkg|snupkg)$' |
                ForEach-Object FullName)
          $record = [ordered]@{
            schemaVersion = 1
            status = 'passed'
            repositoryCommit = $env:GITHUB_SHA
            tag = $env:GITHUB_REF_NAME
            inputs = @($files | ForEach-Object {
              [ordered]@{
                path = [IO.Path]::GetRelativePath((Get-Location).Path, $_).Replace('\', '/')
                sha256 = (Get-FileHash $_ -Algorithm SHA256).Hash.ToLowerInvariant()
              }
            })
          }
          New-Item artifacts/release-qualification -ItemType Directory -Force | Out-Null
          [IO.File]::WriteAllText(
            'artifacts/release-qualification/qualification.json',
            (($record | ConvertTo-Json -Depth 5) + "`n"),
            [Text.UTF8Encoding]::new($false))

      - name: Upload exact-SHA qualification evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: release-qualification-${{ github.sha }}-${{ github.run_attempt }}
          path: artifacts/release-qualification
          if-no-files-found: error
          retention-days: 90

  publish-private-preview:
    name: Promote preview.1 to the private feed
    concurrency:
      group: sharpproof-publish-${{ github.ref_name }}
      cancel-in-progress: false
    if: >-
      github.event_name == 'push' &&
      github.ref_name == 'v1.0.0-preview.1' &&
      github.repository == 'alexyorke/SharpProof'
    needs: release-qualification
    runs-on: ubuntu-latest
    environment: nuget.private-preview
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "9.0.316"
          global-json-file: global.json
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nuget-packages-${{ github.sha }}-${{ github.run_attempt }}
          path: nupkgs
      - name: Publish already-qualified private-preview bytes
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_PRIVATE_API_KEY }}
          NUGET_SOURCE: ${{ vars.NUGET_PRIVATE_SOURCE }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:NUGET_SOURCE) -or
              [string]::IsNullOrWhiteSpace($env:NUGET_API_KEY)) {
            throw 'The private-preview source and API key are required.'
          }
          ./scripts/Test-SharpProofReleaseArtifacts.ps1 -PackageSource nupkgs -ExpectedTag $env:GITHUB_REF_NAME
          ./scripts/Publish-SharpProofRelease.ps1 -PackageSource nupkgs -Source $env:NUGET_SOURCE -ApiKey $env:NUGET_API_KEY -ReadApiKey $env:NUGET_API_KEY

  publish:
    name: Promote qualified packages to public NuGet
    concurrency:
      group: sharpproof-publish-${{ github.ref_name }}
      cancel-in-progress: false
    if: >-
      github.event_name == 'push' &&
      (github.ref_name == 'v1.0.0-preview.2' ||
       github.ref_name == 'v1.0.0-rc.1' ||
       github.ref_name == 'v1.0.0') &&
      github.repository == 'alexyorke/SharpProof'
    needs: release-qualification
    runs-on: ubuntu-latest
    environment: nuget.org
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "9.0.316"
          global-json-file: global.json
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nuget-packages-${{ github.sha }}-${{ github.run_attempt }}
          path: nupkgs
      - name: Exchange GitHub OIDC token for a temporary NuGet key
        id: nuget-login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        with:
          user: ${{ vars.NUGET_USER }}
      - name: Publish already-qualified package and symbol bytes
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          ./scripts/Test-SharpProofReleaseArtifacts.ps1 -PackageSource nupkgs -ExpectedTag $env:GITHUB_REF_NAME
          ./scripts/Publish-SharpProofRelease.ps1 -PackageSource nupkgs -Source https://api.nuget.org/v3/index.json -ApiKey $env:NUGET_API_KEY
