name: Package, consumers, and release

on:
  push:
    branches: [master]
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  COMPOSE_PROJECT_NAME: sharpproof-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
  SHARPPROOF_CONTAINER_CPU_LIMIT: 4

jobs:
  repository-quality:
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/quality.yml
  release-qualification:
    name: Qualified default-branch release commit
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Require exact-commit default-branch test and coverage success
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: bash eng/scripts/Test-SharpProofReleaseCommit.sh

  security:
    name: Exact-SHA security
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/security-reusable.yml
    permissions:
      contents: read

  package:
    name: Pack exact container artifacts
    outputs:
      package-artifact-id: ${{ steps.package-upload.outputs.artifact-id }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Check the tag matches the checked-in package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          prefix="$(sed -n 's:.*<SharpProofVersionPrefix>\(.*\)</SharpProofVersionPrefix>.*:\1:p' eng/Versions.props)"
          template="$(sed -n 's:.*<SharpProofPackageVersion>\(.*\)</SharpProofPackageVersion>.*:\1:p' eng/Versions.props)"
          version="${template//\$(SharpProofVersionPrefix)/$prefix}"
          test "v${version}" = "${GITHUB_REF_NAME}"

      - uses: ./.github/actions/prepare-qualified-packages
        with:
          download-packages: "false"

      # On pull requests and master, ci.yml's package-reproducibility job runs
      # the same format-check and the independent-path package reproduction
      # for the same commit; build-and-test requires both, and release
      # qualification requires that exact-commit master run.
      - name: Require repository linting and formatting before release
        if: startsWith(github.ref, 'refs/tags/v')
        run: docker compose run --rm tooling format-check

      - name: Pack and validate the package graph
        run: docker compose run --rm tooling pack -Configuration Release

      - name: Verify DLL-only offline stack traces from the exact packed payload
        run: >-
          docker compose run --rm tooling dev -lc
          'pwsh -NoLogo -NoProfile -File eng/scripts/Test-SharpProofOfflineStackTraces.ps1
          -PackageSource artifacts/container-packages'

      - name: Smoke test project templates against the exact package graph
        run: >-
          docker compose run --rm tooling dev -lc
          'pwsh -NoLogo -NoProfile -File eng/scripts/Install-SharpProofTemplates.ps1
          -Verify -PackageSource artifacts/container-packages'

      - name: Smoke test the consumer performance harness (one iteration)
        # This verifies the harness and proof quality; it is not a statistical baseline.
        run: >-
          docker compose run --rm tooling dev -lc
          'pwsh -NoLogo -NoProfile -File eng/scripts/Measure-SharpProofConsumerPerformance.ps1
          -PackageSource artifacts/container-packages -Iterations 1'

      - name: Validate read-only doctor regressions
        run: >-
          docker compose run --rm tooling dev -lc
          'pwsh -NoLogo -NoProfile -File eng/scripts/Test-SharpProofDoctor.ps1'

      - name: Record qualified package identities and hashes
        run: |
          docker compose run --rm tooling dev -lc 'pwsh -NoLogo -NoProfile -File eng/scripts/New-SharpProofPackageManifest.ps1 -PackageDirectory artifacts/container-packages'

      - name: Upload NuGet artifacts
        id: package-upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nuget-packages-${{ github.run_id }}-${{ github.sha }}-${{ github.run_attempt }}
          path: artifacts/container-packages/*
          if-no-files-found: error

      - name: Report runner telemetry
        if: always() && hashFiles('.github/actions/runner-telemetry/action.yml') != ''
        uses: ./.github/actions/runner-telemetry
        with:
          mode: report

  container-verifier:
    name: Canonical Linux analyzer and verifier consumers
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: ./.github/actions/prepare-qualified-packages
        with:
          artifact-id: ${{ needs.package.outputs.package-artifact-id }}

      - name: Run analyzer and real verifier consumers
        run: >-
          docker compose run --rm tooling package-consumers
          -Configuration Release
          -PackageSource nupkgs

      - name: Report runner telemetry
        if: always() && hashFiles('.github/actions/runner-telemetry/action.yml') != ''
        uses: ./.github/actions/runner-telemetry
        with:
          mode: report

  # x64 runs inside the Linux portable consumer job below, sharing its setup.
  native-linux-verifier:
    name: Plug-and-play native Linux verifier (${{ matrix.architecture }})
    needs: package
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04-arm
            architecture: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.package.outputs.package-artifact-id }}
          merge-multiple: true
          path: nupkgs
      - name: Prove and refute with one package and default settings
        shell: pwsh
        run: >-
          ./eng/scripts/Test-SharpProofPlugAndPlayConsumer.ps1
          -PackageSource nupkgs -PackageId SharpProof -OsFamily linux
          -Architecture ${{ matrix.architecture }}

  # Each job shares one checkout, SDK setup, and package download across the
  # portable consumer and that platform's native verifier checks, which keeps
  # pull requests within the account's concurrent (especially macOS) job limit.
  portable-consumers:
    name: Portable package consumer (${{ matrix.os }})
    needs: package
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            family: linux
            architecture: x64
          - os: windows-latest
            family: windows
            architecture: x64
          - os: macos-15
            family: macos
            architecture: arm64
          - os: macos-15-intel
            family: macos
            architecture: x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.package.outputs.package-artifact-id }}
          merge-multiple: true
          path: nupkgs
      - name: Run the portable consumer against the packed packages
        run: >-
          pwsh eng/scripts/Test-SharpProofPortableConsumer.ps1
          -PackageSource nupkgs -OsFamily ${{ matrix.family }}
          -Architecture ${{ matrix.architecture }}
      - name: Check the packed Windows Z3 DLL on a native Windows runner
        if: matrix.family == 'windows'
        run: >-
          pwsh eng/scripts/Test-SharpProofWindowsNativePayload.ps1
          -PackageSource nupkgs -Architecture ${{ matrix.architecture }}
      - name: Prove and refute with one package and default settings on Windows
        if: matrix.family == 'windows'
        run: >-
          pwsh eng/scripts/Test-SharpProofPlugAndPlayConsumer.ps1
          -PackageSource nupkgs -PackageId SharpProof -OsFamily windows
          -Architecture ${{ matrix.architecture }}
      - name: Prove, refute, and execute a .NET Framework library consumer
        if: matrix.family == 'windows'
        run: >-
          pwsh eng/scripts/Test-SharpProofPlugAndPlayConsumer.ps1
          -PackageSource nupkgs -PackageId SharpProof -OsFamily windows
          -Architecture ${{ matrix.architecture }} -TargetFramework net48
      - name: Run native Windows proofs against the exact packed verifier
        if: matrix.family == 'windows'
        run: >-
          pwsh eng/scripts/Test-SharpProofWindowsProofs.ps1
          -PackageSource nupkgs -Architecture ${{ matrix.architecture }}

      - name: Prove and refute with one package and default settings on Linux
        if: matrix.family == 'linux'
        shell: pwsh
        run: >-
          ./eng/scripts/Test-SharpProofPlugAndPlayConsumer.ps1
          -PackageSource nupkgs -PackageId SharpProof -OsFamily linux
          -Architecture ${{ matrix.architecture }}
      - name: Prove and refute with one package and default settings on macOS
        if: matrix.family == 'macos'
        run: >-
          pwsh eng/scripts/Test-SharpProofPlugAndPlayConsumer.ps1
          -PackageSource nupkgs -PackageId SharpProof -OsFamily macos
          -Architecture ${{ matrix.architecture }}
      - name: Prove a claim and reject a modified native payload
        if: matrix.family == 'macos'
        run: >-
          pwsh eng/scripts/Test-SharpProofMacOsVerifierConsumer.ps1
          -PackageSource nupkgs -Architecture ${{ matrix.architecture }}

  visual-studio-consumers:
    name: Visual Studio ${{ matrix.majorVersion }} package consumer
    needs: package
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            majorVersion: 17
            sdkVersion: 9.0.300
          - os: windows-2025-vs2026
            majorVersion: 18
            sdkVersion: 10.0.402
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          dotnet-version: ${{ matrix.sdkVersion }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.package.outputs.package-artifact-id }}
          merge-multiple: true
          path: nupkgs
      - name: Qualify Visual Studio MSBuild and compiler host against the packed packages
        shell: pwsh
        run: >-
          ./eng/scripts/Test-SharpProofVisualStudioConsumer.ps1
          -PackageSource nupkgs -MajorVersion ${{ matrix.majorVersion }}

  native-windows-arm64-verifier:
    name: Native Windows ARM64 verifier
    needs: package
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          architecture: arm64
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.package.outputs.package-artifact-id }}
          merge-multiple: true
          path: nupkgs
      - name: Prove, refute, and consume a library with one package and default settings
        shell: pwsh
        run: >-
          ./eng/scripts/Test-SharpProofPlugAndPlayConsumer.ps1
          -PackageSource nupkgs -PackageId SharpProof -OsFamily windows -Architecture arm64
      - name: Validate the ARM64 PE payload, runtime prerequisites, native load, and export
        shell: pwsh
        run: >-
          ./eng/scripts/Test-SharpProofWindowsNativePayload.ps1
          -PackageSource nupkgs -Architecture arm64
      - name: Exercise native proof outcomes, cancellation, publication paths, and payload integrity
        shell: pwsh
        run: >-
          ./eng/scripts/Test-SharpProofWindowsProofs.ps1
          -PackageSource nupkgs -Architecture arm64

  developer-experience:
    name: Developer tools, templates, and canonical consumer image
    needs: [repository-quality, release-qualification, security, package, container-verifier, native-linux-verifier, native-windows-arm64-verifier, portable-consumers, visual-studio-consumers, optional-tool, provenance]
    if: >-
      always() && needs.package.result == 'success' &&
      needs.container-verifier.result == 'success' && needs.portable-consumers.result == 'success' &&
      needs.optional-tool.result == 'success' &&
      (!startsWith(github.ref, 'refs/tags/v') ||
        (needs.repository-quality.result == 'success' && needs.release-qualification.result == 'success' &&
         needs.security.result == 'success' && needs.native-linux-verifier.result == 'success' &&
         needs.native-windows-arm64-verifier.result == 'success' && needs.visual-studio-consumers.result == 'success' &&
         needs.provenance.result == 'success'))
    outputs:
      developer-artifact-id: ${{ steps.developer-upload.outputs.artifact-id }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/prepare-qualified-packages
        with:
          artifact-id: ${{ needs.package.outputs.package-artifact-id }}
      - name: Download the exact separately qualified CLI archive
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.optional-tool.outputs.tool-artifact-id }}
          merge-multiple: true
          path: tool-nupkgs
      - name: Build candidate consumer image
        id: consumer
        shell: bash
        run: |
          set -euo pipefail
          prefix="$(sed -n 's:.*<SharpProofVersionPrefix>\(.*\)</SharpProofVersionPrefix>.*:\1:p' eng/Versions.props)"
          template="$(sed -n 's:.*<SharpProofPackageVersion>\(.*\)</SharpProofPackageVersion>.*:\1:p' eng/Versions.props)"
          version="${template//\$(SharpProofVersionPrefix)/$prefix}"
          docker buildx build --platform linux/amd64 --file eng/container/Dockerfile \
            --target consumer --build-arg "SHARPPROOF_PACKAGE_VERSION=${version}" --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --provenance=false --load --metadata-file consumer-image.json \
            --tag "ghcr.io/alexyorke/sharpproof:sha-${GITHUB_SHA}" .
          digest="$(jq -r '."containerimage.digest"' consumer-image.json)"
          [[ "${digest}" =~ ^sha256:[a-f0-9]{64}$ ]]
          echo "reference=ghcr.io/alexyorke/sharpproof@${digest}" >> "${GITHUB_OUTPUT}"
          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"
      - name: Qualify exact packages and generated consumers
        env:
          SHARPPROOF_CONSUMER_IMAGE: ${{ steps.consumer.outputs.reference }}
          SHARPPROOF_QUALIFIED_TOOL_PACKAGES: tool-nupkgs
        run: >-
          docker compose run --rm -e SHARPPROOF_CONSUMER_IMAGE -e SHARPPROOF_QUALIFIED_TOOL_PACKAGES tooling
          developer-experience -Configuration Release -PackageSource nupkgs
      - name: Exercise the retained generated Compose project in the exact candidate image
        env:
          QUALIFIED_CONSUMER_IMAGE: ${{ steps.consumer.outputs.reference }}
        shell: bash
        run: |
          set -euo pipefail
          fixture="$(find artifacts/developer-experience -mindepth 2 -maxdepth 2 -type d -name consumer -print -quit)"
          test -f "${fixture}/Native.csproj"
          image="ghcr.io/alexyorke/sharpproof:sha-${GITHUB_SHA}"
          pwsh -NoLogo -NoProfile -File eng/scripts/Test-SharpProofTemplateCompose.ps1 \
            -EvidenceDirectory "$(dirname "${fixture}")" -ConsumerImage "${QUALIFIED_CONSUMER_IMAGE}" \
            -LocalImage "${image}" -BuildMetadataPath consumer-image.json
      - name: Record exact optional editor and template archives
        env:
          QUALIFIED_CONSUMER_IMAGE: ${{ steps.consumer.outputs.reference }}
        run: |
          set -euo pipefail
          fixture="$(find artifacts/developer-experience -mindepth 2 -maxdepth 2 -type d -name packages -print -quit)"
          test -n "$fixture"
          docker compose run --rm -e QUALIFIED_DEVELOPER_PACKAGES="$fixture" -e QUALIFIED_COMMIT="$GITHUB_SHA" -e QUALIFIED_CONSUMER_IMAGE tooling dev -lc \
            '
            set -euo pipefail
            pwsh -NoProfile -File eng/scripts/Test-SharpProofDeveloperRelease.ps1
            pwsh -NoProfile -File eng/scripts/Record-SharpProofDeveloperPackages.ps1 -PackageSource "$QUALIFIED_DEVELOPER_PACKAGES" -RepositoryCommit "$QUALIFIED_COMMIT" -ConsumerImage "$QUALIFIED_CONSUMER_IMAGE"
            '
      - name: Attest qualified developer archives and their identity inventory
        if: startsWith(github.ref, 'refs/tags/v') && github.repository == 'alexyorke/SharpProof'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: artifacts/developer-packages/*
      - name: Upload exact developer package feed
        id: developer-upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: developer-packages-${{ github.run_id }}-${{ github.sha }}-${{ github.run_attempt }}
          path: artifacts/developer-packages/*
          if-no-files-found: error
      - name: Publish qualified immutable consumer image
        if: startsWith(github.ref, 'refs/tags/v') && github.repository == 'alexyorke/SharpProof'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXPECTED_DIGEST: ${{ steps.consumer.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          bash eng/scripts/Test-SharpProofConsumerImagePublication.sh
          bash eng/scripts/Publish-SharpProofConsumerImage.sh "$GITHUB_SHA" "$GITHUB_REF_NAME" "$EXPECTED_DIGEST"
      - name: Attest the same published consumer-image digest
        if: startsWith(github.ref, 'refs/tags/v') && github.repository == 'alexyorke/SharpProof'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/alexyorke/sharpproof
          subject-digest: ${{ steps.consumer.outputs.digest }}
          push-to-registry: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: developer-consumer-image-${{ github.run_id }}-${{ github.sha }}-${{ github.run_attempt }}
          path: consumer-image.json
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: developer-experience-${{ github.run_id }}-${{ github.sha }}-${{ github.run_attempt }}
          path: artifacts/developer-experience/
          if-no-files-found: error
          overwrite: true

  optional-tool:
    name: Pack and qualify the optional CLI tool
    outputs:
      tool-artifact-id: ${{ steps.tool-upload.outputs.artifact-id }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/prepare-qualified-packages
        with:
          download-packages: "false"
      - name: Pack the isolated optional tool feed
        run: docker compose run --rm tooling pack-tool -Configuration Release
      - name: Restore the exact tool into an outside-repository local manifest and exercise it
        run: >-
          docker compose run --rm tooling tool-consumer
          -PackageSource artifacts/tool-packages
      - name: Record the separate optional tool identity and hashes
        run: >-
          docker compose run --rm tooling dev -lc
          'pwsh -NoLogo -NoProfile -File eng/scripts/New-SharpProofPackageManifest.ps1
          -PackageDirectory artifacts/tool-packages'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: tool-upload
        with:
          name: nuget-tool-${{ github.run_id }}-${{ github.sha }}-${{ github.run_attempt }}
          path: artifacts/tool-packages/*
          if-no-files-found: error

  provenance:
    name: Attest qualified release packages
    if: startsWith(github.ref, 'refs/tags/v') && github.repository == 'alexyorke/SharpProof'
    needs: [release-qualification, security, package, container-verifier, native-linux-verifier, native-windows-arm64-verifier, portable-consumers, visual-studio-consumers, optional-tool]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      evidence-artifact-id: ${{ steps.signed-evidence-upload.outputs.artifact-id }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/prepare-qualified-packages
        with:
          download-packages: "false"
      - name: Download the immutable optional tool feed
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.optional-tool.outputs.tool-artifact-id }}
          merge-multiple: true
          path: tool-nupkgs
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.package.outputs.package-artifact-id }}
          merge-multiple: true
          path: nupkgs
      - name: Prepare exact package contents and identity inventory for the SBOM
        run: |
          set -euo pipefail
          mkdir -p release-evidence sbom-input
          cp nupkgs/packages.lock.json sbom-input/
          for package in nupkgs/*.nupkg; do
            unzip -q "$package" -d "sbom-input/$(basename "$package" .nupkg)"
          done
      - name: Generate the exact package graph SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: sbom-input
          syft-version: v1.54.1
          format: spdx-json
          output-file: release-evidence/packages.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Reject an SBOM missing any qualified package identity
        run: |
          set -euo pipefail
          while IFS=$'\t' read -r id version _filename _archive_sha512 _nuget_content_hash; do
            jq -e --arg id "$id" --arg version "$version" \
              '.packages | any(.[]; (.name | ascii_downcase) == $id and .versionInfo == $version)' \
              release-evidence/packages.spdx.json > /dev/null
          done < nupkgs/packages.tsv
      - name: Record release artifact checksums
        run: sha256sum nupkgs/*.nupkg nupkgs/*.snupkg nupkgs/packages.tsv nupkgs/packages.lock.json nupkgs/Test-SharpProofPublishedPackages.sh release-evidence/packages.spdx.json > release-evidence/SHA256SUMS
      - name: Attest package and evidence provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            nupkgs/*.nupkg
            nupkgs/*.snupkg
            tool-nupkgs/*.nupkg
            tool-nupkgs/packages.tsv
            tool-nupkgs/packages.lock.json
            tool-nupkgs/Test-SharpProofPublishedPackages.sh
            nupkgs/packages.tsv
            nupkgs/packages.lock.json
            nupkgs/Test-SharpProofPublishedPackages.sh
            release-evidence/*
      - name: Attest the package SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: nupkgs/*.nupkg
          sbom-path: release-evidence/packages.spdx.json
      - name: Authenticate the exact artifacts and generate the shipped-payload SBOM
        run: |
          set -euo pipefail
          docker compose run --rm -e RELEASE_SOURCE_COMMIT="$GITHUB_SHA" tooling dev -lc '
            set -euo pipefail
            pwsh -NoLogo -NoProfile -File eng/scripts/Test-SharpProofReleaseEvidenceRegression.ps1
            pwsh -NoLogo -NoProfile -File eng/scripts/Test-SharpProofPackageConsumers.ps1 -PackageSource nupkgs -ValidatePackageSourceOnly
            pwsh -NoLogo -NoProfile -File eng/scripts/New-SharpProofReleaseEvidence.ps1 -PackageSource nupkgs -OutputDirectory artifacts/release-supply-chain -RepositoryCommit "$RELEASE_SOURCE_COMMIT"
            pwsh -NoLogo -NoProfile -File eng/scripts/Test-SharpProofReleaseEvidence.ps1 -PackageSource nupkgs -EvidenceDirectory artifacts/release-supply-chain -RepositoryCommit "$RELEASE_SOURCE_COMMIT"
            pwsh -NoLogo -NoProfile -File eng/scripts/New-SharpProofToolReleaseEvidence.ps1 -PackageSource tool-nupkgs -OutputDirectory artifacts/release-supply-chain -RepositoryCommit "$RELEASE_SOURCE_COMMIT"
          '

      - name: Attest the qualified release artifacts and evidence
        id: release-provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            nupkgs/*.nupkg
            nupkgs/*.snupkg
            artifacts/release-supply-chain/sbom.spdx.json
            artifacts/release-supply-chain/release-manifest.json
          create-storage-record: false

      - name: Attest the release SBOM against the same five packages
        id: release-sbom
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            nupkgs/*.nupkg
            nupkgs/*.snupkg
          sbom-path: artifacts/release-supply-chain/sbom.spdx.json
          create-storage-record: false

      - name: Attest the optional tool's exact qualified archive
        id: tool-provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            tool-nupkgs/*.nupkg
            artifacts/release-supply-chain/tool-release-manifest.json
          create-storage-record: false

      - name: Preserve the exact signed bundles for the publisher
        env:
          PROVENANCE_BUNDLE: ${{ steps.release-provenance.outputs.bundle-path }}
          SBOM_BUNDLE: ${{ steps.release-sbom.outputs.bundle-path }}
          TOOL_BUNDLE: ${{ steps.tool-provenance.outputs.bundle-path }}
        run: |
          set -euo pipefail
          cp "$PROVENANCE_BUNDLE" artifacts/release-supply-chain/provenance.sigstore.json
          cp "$SBOM_BUNDLE" artifacts/release-supply-chain/sbom.sigstore.json
          cp "$TOOL_BUNDLE" artifacts/release-supply-chain/tool-provenance.sigstore.json
      - name: Retain immutable signed archive evidence
        id: signed-evidence-upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signed-release-evidence-${{ github.sha }}-${{ github.run_attempt }}
          path: artifacts/release-supply-chain
          if-no-files-found: error
          retention-days: 90
      - name: Retain release provenance and SBOM evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-evidence-${{ github.sha }}-${{ github.run_attempt }}
          path: release-evidence
          if-no-files-found: error
          retention-days: 90

  publish:
    name: Publish packages
    concurrency:
      group: sharpproof-publish-${{ github.ref_name }}
      cancel-in-progress: false
    if: >-
      startsWith(github.ref, 'refs/tags/v') &&
      github.repository == 'alexyorke/SharpProof'
    needs:
      - repository-quality
      - release-qualification
      - provenance
      - security
      - package
      - container-verifier
      - native-linux-verifier
      - native-windows-arm64-verifier
      - portable-consumers
      - visual-studio-consumers
      - optional-tool
      - developer-experience
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'v1.0.0-preview.1' && 'nuget.private-preview' || 'nuget.org' }}
    permissions:
      contents: write
      id-token: write
      attestations: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.package.outputs.package-artifact-id }}
          merge-multiple: true
          path: nupkgs

      - name: Download the immutable signed release evidence
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.provenance.outputs.evidence-artifact-id }}
          merge-multiple: true
          path: artifacts/release-supply-chain
      - name: Download the separately qualified optional tool
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.optional-tool.outputs.tool-artifact-id }}
          merge-multiple: true
          path: tool-nupkgs

      - uses: ./.github/actions/prepare-qualified-packages
        with:
          download-packages: "false"

      - name: Validate the immutable archive evidence before publication
        run: |
          set -euo pipefail
          docker compose run --rm -e RELEASE_SOURCE_COMMIT="$GITHUB_SHA" tooling dev -lc '
            pwsh -NoLogo -NoProfile -File eng/scripts/Test-SharpProofReleaseEvidence.ps1 -PackageSource nupkgs -EvidenceDirectory artifacts/release-supply-chain -RepositoryCommit "$RELEASE_SOURCE_COMMIT"
          '
          (cd tool-nupkgs && sha256sum --check --strict ../artifacts/release-supply-chain/TOOL-SHA256SUMS)
      - name: Verify signed provenance and SBOM before publication
        env:
          GH_TOKEN: ${{ github.token }}
          PROVENANCE_BUNDLE: artifacts/release-supply-chain/provenance.sigstore.json
          SBOM_BUNDLE: artifacts/release-supply-chain/sbom.sigstore.json
          TOOL_BUNDLE: artifacts/release-supply-chain/tool-provenance.sigstore.json
        run: |
          set -euo pipefail
          mkdir -p artifacts/release-verification
          cp artifacts/release-supply-chain/sbom.spdx.json artifacts/release-supply-chain/release-manifest.json artifacts/release-verification/
          bash eng/scripts/Test-SharpProofReleaseAttestations.sh nupkgs artifacts/release-verification "$GITHUB_REPOSITORY" "$GITHUB_SHA" "$PROVENANCE_BUNDLE" "$SBOM_BUNDLE"
          for tool in tool-nupkgs/*.nupkg; do
            gh attestation verify "$tool" --bundle "$TOOL_BUNDLE" --repo "$GITHUB_REPOSITORY" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/package-consumers.yml" --source-digest "$GITHUB_SHA" --deny-self-hosted-runners
          done
          gh attestation verify artifacts/release-supply-chain/tool-release-manifest.json --bundle "$TOOL_BUNDLE" --repo "$GITHUB_REPOSITORY" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/package-consumers.yml" --source-digest "$GITHUB_SHA" --deny-self-hosted-runners
      - name: Verify qualified artifact provenance before requesting credentials
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for artifact in nupkgs/*.nupkg nupkgs/*.snupkg nupkgs/packages.tsv nupkgs/packages.lock.json nupkgs/Test-SharpProofPublishedPackages.sh tool-nupkgs/*.nupkg tool-nupkgs/packages.tsv tool-nupkgs/packages.lock.json tool-nupkgs/Test-SharpProofPublishedPackages.sh; do
            gh attestation verify "$artifact" --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/package-consumers.yml" \
              --source-ref "$GITHUB_REF" --source-digest "$GITHUB_SHA" \
              --predicate-type https://slsa.dev/provenance/v1
          done
      - name: Reject public package versions with different bytes
        if: github.ref_name != 'v1.0.0-preview.1'
        run: |
          bash nupkgs/Test-SharpProofPublishedPackages.sh preflight nupkgs
          bash tool-nupkgs/Test-SharpProofPublishedPackages.sh preflight tool-nupkgs

      - name: Exchange GitHub OIDC token for a temporary NuGet key
        if: github.ref_name != 'v1.0.0-preview.1'
        id: nuget-login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Recheck the package bytes immediately before pushing
        run: |
          set -euo pipefail
          docker compose run --rm -e RELEASE_SOURCE_COMMIT="$GITHUB_SHA" tooling dev -lc '
            pwsh -NoLogo -NoProfile -File eng/scripts/Test-SharpProofReleaseEvidence.ps1 -PackageSource nupkgs -EvidenceDirectory artifacts/release-supply-chain -RepositoryCommit "$RELEASE_SOURCE_COMMIT"
          '

      - name: Push packages and symbols
        env:
          NUGET_API_KEY: >-
            ${{ github.ref_name == 'v1.0.0-preview.1' &&
                secrets.NUGET_PRIVATE_API_KEY ||
                steps.nuget-login.outputs.NUGET_API_KEY }}
          NUGET_SOURCE: >-
            ${{ github.ref_name == 'v1.0.0-preview.1' &&
                vars.NUGET_PRIVATE_SOURCE ||
                'https://api.nuget.org/v3/index.json' }}
        run: |
          set -euo pipefail
          test -n "${NUGET_SOURCE}"
          test -n "${NUGET_API_KEY}"
          push_args=()
          if [[ "$GITHUB_REF_NAME" != v1.0.0-preview.1 ]]; then
            push_args+=(--skip-duplicate)
          fi
          dotnet nuget push "nupkgs/*.nupkg" \
            --source "${NUGET_SOURCE}" \
            --api-key "${NUGET_API_KEY}" \
            "${push_args[@]}"

      - name: Verify public feed package bytes after publication
        if: github.ref_name != 'v1.0.0-preview.1'
        run: |
          bash nupkgs/Test-SharpProofPublishedPackages.sh published nupkgs

      - name: Push the separately qualified optional tool
        env:
          NUGET_API_KEY: >-
            ${{ github.ref_name == 'v1.0.0-preview.1' &&
                secrets.NUGET_PRIVATE_API_KEY ||
                steps.nuget-login.outputs.NUGET_API_KEY }}
          NUGET_SOURCE: >-
            ${{ github.ref_name == 'v1.0.0-preview.1' &&
                vars.NUGET_PRIVATE_SOURCE ||
                'https://api.nuget.org/v3/index.json' }}
        run: |
          set -euo pipefail
          test -n "${NUGET_SOURCE}"
          test -n "${NUGET_API_KEY}"
          (cd tool-nupkgs && sha256sum --check --strict ../artifacts/release-supply-chain/TOOL-SHA256SUMS)
          push_args=()
          if [[ "$GITHUB_REF_NAME" != v1.0.0-preview.1 ]]; then
            push_args+=(--skip-duplicate)
          fi
          dotnet nuget push "tool-nupkgs/*.nupkg" \
            --source "${NUGET_SOURCE}" \
            --api-key "${NUGET_API_KEY}" \
            "${push_args[@]}"

      - name: Verify the public optional tool after publication
        if: github.ref_name != 'v1.0.0-preview.1'
        run: bash tool-nupkgs/Test-SharpProofPublishedPackages.sh published tool-nupkgs

      - name: Publish the same package bytes and signed evidence as GitHub release assets
        if: github.ref_name != 'v1.0.0-preview.1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Refuse to overwrite an existing release or its assets on a rerun.
          while read -r digest filename; do
            if [[ "$filename" == *.nupkg || "$filename" == *.snupkg ]]; then
              printf '%s  %s\n' "$digest" "nupkgs/$filename" | sha256sum --check --strict
            fi
          done < artifacts/release-supply-chain/SHA256SUMS
          (cd tool-nupkgs && sha256sum --check --strict ../artifacts/release-supply-chain/TOOL-SHA256SUMS)
          flags=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --target "$GITHUB_SHA" --draft --generate-notes "${flags[@]}" \
            nupkgs/*.nupkg nupkgs/*.snupkg tool-nupkgs/*.nupkg \
            artifacts/release-supply-chain/sbom.spdx.json \
            artifacts/release-supply-chain/release-manifest.json \
            artifacts/release-supply-chain/SHA256SUMS \
            artifacts/release-supply-chain/provenance.sigstore.json \
            artifacts/release-supply-chain/sbom.sigstore.json \
            artifacts/release-supply-chain/TOOL-SHA256SUMS \
            artifacts/release-supply-chain/tool-release-manifest.json \
            artifacts/release-supply-chain/tool-provenance.sigstore.json
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false

  publish-developer-packages:
    name: Publish qualified optional editor and templates
    if: startsWith(github.ref, 'refs/tags/v') && github.repository == 'alexyorke/SharpProof'
    needs: [publish, developer-experience]
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'v1.0.0-preview.1' && 'nuget.private-preview' || 'nuget.org' }}
    permissions:
      contents: read
      attestations: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.developer-experience.outputs.developer-artifact-id }}
          merge-multiple: true
          path: developer-nupkgs
      - name: Authenticate exact source and archive bytes before requesting feed credentials
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for artifact in developer-nupkgs/*; do
            gh attestation verify "$artifact" --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/package-consumers.yml" \
              --source-ref "$GITHUB_REF" --source-digest "$GITHUB_SHA" \
              --predicate-type https://slsa.dev/provenance/v1 --deny-self-hosted-runners
          done
          (cd developer-nupkgs && sha256sum --check --strict SHA256SUMS)
          jq -e --arg source "$GITHUB_SHA" --arg version "${GITHUB_REF_NAME#v}" '
            .schemaVersion == 1 and .repositoryCommit == $source and .packageVersion == $version and
            (.consumerImage | test("^ghcr\\.io/alexyorke/sharpproof@sha256:[a-f0-9]{64}$")) and
            ([.packages[].id] | sort) == ["SharpProof.CodeFixes", "SharpProof.Templates"]
          ' developer-nupkgs/developer-release-manifest.json > /dev/null
      - name: Reject public developer package versions with different content
        if: github.ref_name != 'v1.0.0-preview.1'
        run: bash developer-nupkgs/Test-SharpProofPublishedPackages.sh preflight developer-nupkgs
      - uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        if: github.ref_name != 'v1.0.0-preview.1'
        id: nuget-login
        with:
          user: ${{ vars.NUGET_USER }}
      - name: Push the exact qualified developer archives
        env:
          NUGET_API_KEY: ${{ github.ref_name == 'v1.0.0-preview.1' && secrets.NUGET_PRIVATE_API_KEY || steps.nuget-login.outputs.NUGET_API_KEY }}
          NUGET_SOURCE: ${{ github.ref_name == 'v1.0.0-preview.1' && vars.NUGET_PRIVATE_SOURCE || 'https://api.nuget.org/v3/index.json' }}
        run: |
          set -euo pipefail
          test -n "$NUGET_API_KEY"
          test -n "$NUGET_SOURCE"
          (cd developer-nupkgs && sha256sum --check --strict SHA256SUMS)
          push_args=()
          if [[ "$GITHUB_REF_NAME" != v1.0.0-preview.1 ]]; then push_args+=(--skip-duplicate); fi
          dotnet nuget push 'developer-nupkgs/*.nupkg' --source "$NUGET_SOURCE" --api-key "$NUGET_API_KEY" "${push_args[@]}"
      - name: Verify public package bytes after publication
        if: github.ref_name != 'v1.0.0-preview.1'
        run: bash developer-nupkgs/Test-SharpProofPublishedPackages.sh published developer-nupkgs
