name: Cross-platform package consumers
on:
  push:
    branches: [master]
  pull_request:
    branches: ["**"]
  workflow_dispatch:
jobs:
  package-consumer:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows packaged analyzer and worker
            os: windows-latest
          - name: Linux packaged analyzer
            os: ubuntu-latest
          - name: macOS x64 packaged analyzer
            os: macos-15-intel
          - name: macOS ARM64 packaged analyzer
            os: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Setup required .NET SDKs
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
          global-json-file: global.json
      - name: Build packages and run consumers
        shell: pwsh
        run: >-
          ./scripts/Test-SharpProofPackageConsumers.ps1
          -Configuration Release
