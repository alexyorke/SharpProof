name: Package, consumers, and release

on:
  push:
    branches: [master]
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  COMPOSE_PROJECT_NAME: sharpproof-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
  SHARPPROOF_CONTAINER_CPU_LIMIT: 4

jobs:
  repository-quality:
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/quality.yml

  security:
    name: Exact-SHA security
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/security-reusable.yml
    permissions:
      contents: read

  package:
    name: Pack exact container artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Check the tag matches the checked-in package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          prefix="$(sed -n 's:.*<SharpProofVersionPrefix>\(.*\)</SharpProofVersionPrefix>.*:\1:p' SharpProof.Release.props)"
          template="$(sed -n 's:.*<SharpProofPackageVersion>\(.*\)</SharpProofPackageVersion>.*:\1:p' SharpProof.Release.props)"
          version="${template//\$(SharpProofVersionPrefix)/$prefix}"
          test "v${version}" = "${GITHUB_REF_NAME}"

      - uses: ./.github/actions/prepare-qualified-packages
        with:
          download-packages: "false"

      - name: Pack and validate the package graph
        run: docker compose run --rm tooling pack -Configuration Release

      - name: Smoke test project templates against the exact package graph
        run: >-
          docker compose run --rm tooling dev -lc
          'pwsh -NoLogo -NoProfile -File scripts/Install-SharpProofTemplates.ps1
          -Verify -PackageSource artifacts/container-packages'

      - name: Smoke test the consumer performance harness (one iteration)
        # This verifies the harness and proof quality; it is not a statistical baseline.
        run: >-
          docker compose run --rm tooling dev -lc
          'pwsh -NoLogo -NoProfile -File scripts/Measure-SharpProofConsumerPerformance.ps1
          -PackageSource artifacts/container-packages -Iterations 1'

      - name: Validate read-only doctor regressions
        run: >-
          docker compose run --rm tooling dev -lc
          'pwsh -NoLogo -NoProfile -File scripts/Test-SharpProofDoctor.ps1'

      - name: Upload NuGet artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nuget-packages-${{ github.run_id }}-${{ github.sha }}
          path: artifacts/container-packages/*
          if-no-files-found: error
          overwrite: true

  container-verifier:
    name: Canonical Linux analyzer and verifier consumers
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: ./.github/actions/prepare-qualified-packages

      - name: Run analyzer and real verifier consumers
        run: >-
          docker compose run --rm tooling package-consumers
          -Configuration Release
          -PackageSource nupkgs

  native-linux-verifier:
    name: Plug-and-play native Linux verifier (${{ matrix.architecture }})
    needs: package
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            architecture: x64
          - os: ubuntu-24.04-arm
            architecture: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nuget-packages-${{ github.run_id }}-${{ github.sha }}
          path: nupkgs
      - name: Prove and refute with one package and default settings
        shell: pwsh
        run: >-
          ./scripts/Test-SharpProofPlugAndPlayConsumer.ps1
          -PackageSource nupkgs -OsFamily linux
          -Architecture ${{ matrix.architecture }}

  portable-consumers:
    name: Portable package consumer (${{ matrix.os }})
    needs: package
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            family: linux
            architecture: x64
          - os: windows-latest
            family: windows
            architecture: x64
          - os: macos-15
            family: macos
            architecture: arm64
          - os: macos-15-intel
            family: macos
            architecture: x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nuget-packages-${{ github.run_id }}-${{ github.sha }}
          path: nupkgs
      - name: Run the portable consumer against the packed packages
        run: >-
          pwsh scripts/Test-SharpProofPortableConsumer.ps1
          -PackageSource nupkgs -OsFamily ${{ matrix.family }}
          -Architecture ${{ matrix.architecture }}
      - name: Check the packed Windows Z3 DLL on a native Windows runner
        if: matrix.family == 'windows'
        run: >-
          pwsh scripts/Test-SharpProofWindowsNativePayload.ps1
          -PackageSource nupkgs
      - name: Prove and refute with one package and default settings on Windows
        if: matrix.family == 'windows'
        run: >-
          pwsh scripts/Test-SharpProofPlugAndPlayConsumer.ps1
          -PackageSource nupkgs -OsFamily windows
          -Architecture ${{ matrix.architecture }}
      - name: Run native Windows proofs against the exact packed verifier
        if: matrix.family == 'windows'
        run: >-
          pwsh scripts/Test-SharpProofWindowsProofs.ps1
          -PackageSource nupkgs

  macos-verifier:
    name: Native macOS verifier (${{ matrix.os }})
    needs: package
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            architecture: arm64
          - os: macos-15-intel
            architecture: x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nuget-packages-${{ github.run_id }}-${{ github.sha }}
          path: nupkgs
      - name: Prove and refute with one package and default settings on macOS
        run: >-
          pwsh scripts/Test-SharpProofPlugAndPlayConsumer.ps1
          -PackageSource nupkgs -OsFamily macos
          -Architecture ${{ matrix.architecture }}
      - name: Prove a claim and reject a modified native payload
        run: >-
          pwsh scripts/Test-SharpProofMacOsVerifierConsumer.ps1
          -PackageSource nupkgs -Architecture ${{ matrix.architecture }}

  publish:
    name: Publish packages
    concurrency:
      group: sharpproof-publish-${{ github.ref_name }}
      cancel-in-progress: false
    if: >-
      startsWith(github.ref, 'refs/tags/v') &&
      github.repository == 'alexyorke/SharpProof'
    needs:
      - repository-quality
      - security
      - package
      - container-verifier
      - native-linux-verifier
      - portable-consumers
      - macos-verifier
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'v1.0.0-preview.1' && 'nuget.private-preview' || 'nuget.org' }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nuget-packages-${{ github.run_id }}-${{ github.sha }}
          path: nupkgs

      - name: Exchange GitHub OIDC token for a temporary NuGet key
        if: github.ref_name != 'v1.0.0-preview.1'
        id: nuget-login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Push packages and symbols
        env:
          NUGET_API_KEY: >-
            ${{ github.ref_name == 'v1.0.0-preview.1' &&
                secrets.NUGET_PRIVATE_API_KEY ||
                steps.nuget-login.outputs.NUGET_API_KEY }}
          NUGET_SOURCE: >-
            ${{ github.ref_name == 'v1.0.0-preview.1' &&
                vars.NUGET_PRIVATE_SOURCE ||
                'https://api.nuget.org/v3/index.json' }}
        run: |
          set -euo pipefail
          test -n "${NUGET_SOURCE}"
          test -n "${NUGET_API_KEY}"
          dotnet nuget push "nupkgs/*.nupkg" \
            --source "${NUGET_SOURCE}" \
            --api-key "${NUGET_API_KEY}" \
            --skip-duplicate
