name: Retain private preview host acceptance

on:
  workflow_dispatch:
    inputs:
      receipt_directory:
        description: Checked private repository path private-preview-receipts/<candidate-artifact-id>
        type: string
        required: true

permissions:
  contents: read

jobs:
  retain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Bound actual owner-supplied private host evidence
        id: receipts
        env:
          RECEIPT_DIRECTORY: ${{ inputs.receipt_directory }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REPOSITORY" == alexyorke/SharpProof-preview && "$GITHUB_EVENT_NAME" == workflow_dispatch && "$GITHUB_REF" == refs/heads/main ]]
          [[ "$GITHUB_ACTOR" == alexyorke && "$GITHUB_TRIGGERING_ACTOR" == alexyorke ]]
          [[ "$RECEIPT_DIRECTORY" =~ ^private-preview-receipts/[1-9][0-9]*$ ]]
          [[ -z "$(find "$RECEIPT_DIRECTORY" -type l -print -quit)" ]]
          path="$(realpath -e -- "$RECEIPT_DIRECTORY")"
          [[ "$path" == "$GITHUB_WORKSPACE/$RECEIPT_DIRECTORY" ]]
          test -s "$path/editor-acceptance.json"
          echo "path=$path" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: private-preview-acceptance-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.receipts.outputs.path }}/
          if-no-files-found: error
          retention-days: 90
