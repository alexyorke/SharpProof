name: Security

on:
  push:
    branches: [master]
  pull_request:
    branches: ["**"]
  schedule:
    - cron: "41 7 * * 3"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-sha-security:
    uses: ./.github/workflows/security-reusable.yml
    with:
      run-dependency-review: ${{ github.event_name == 'pull_request' }}
    permissions:
      contents: read
      packages: read
