name: Reusable exact-SHA security gates

on:
  workflow_call:
    inputs:
      run-dependency-review:
        description: Run the pull-request dependency delta review.
        required: false
        type: boolean
        default: false

permissions:
  contents: read

env:
  SHARPPROOF_CONTAINER_CPU_LIMIT: 4

jobs:
  dependency-review:
    if: inputs.run-dependency-review
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Reject vulnerable dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: low
          deny-licenses: GPL-2.0-only, GPL-3.0-only, AGPL-1.0-only, AGPL-3.0-only

  dependency-audit:
    runs-on: ubuntu-latest
    env:
      COMPOSE_PROJECT_NAME: sharpproof-security-deps-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Build the pinned toolchain
        uses: ./.github/actions/build-tooling

      - name: Reject vulnerable direct or transitive packages
        run: docker compose run --rm tooling dependency-audit

      - name: Retain fail-closed dependency-audit evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: >-
            security-dependency-audit-${{ github.sha }}-${{ github.run_attempt }}
          path: artifacts/dependency-audit/dependency-audit.json
          if-no-files-found: error

  banned-apis:
    runs-on: ubuntu-latest
    env:
      COMPOSE_PROJECT_NAME: sharpproof-security-banned-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Build the pinned toolchain
        uses: ./.github/actions/build-tooling

      - name: Enforce banned APIs and production analyzer warnings
        run: >-
          docker compose run --rm tooling build
          -Configuration Release
          -Target SharpProof.sln
