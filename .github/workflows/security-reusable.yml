name: Shared dependency and banned-API checks

on:
  workflow_call:
    inputs:
      run-dependency-review:
        description: Run the pull-request dependency delta review.
        required: false
        type: boolean
        default: false

permissions:
  contents: read

env:
  SHARPPROOF_CI_PACKAGE_VERSION: ${{ github.repository == 'alexyorke/SharpProof' && !startsWith(github.ref, 'refs/tags/v') && format('0.0.0-ci.{0}.{1}', github.run_id, github.run_attempt) || '' }}
  SHARPPROOF_CONTAINER_CPU_LIMIT: 4

jobs:
  dependency-review:
    if: inputs.run-dependency-review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Reject vulnerable dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: low
          deny-licenses: GPL-2.0-only, GPL-3.0-only, AGPL-1.0-only, AGPL-3.0-only

  repository-security:
    runs-on: ubuntu-latest
    env:
      COMPOSE_PROJECT_NAME: sharpproof-security-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: ./.github/actions/prepare-qualified-packages
        with:
          download-packages: "false"

      - name: Run the locally reproducible security profile
        run: docker compose run --rm tooling security

      - name: Retain fail-closed dependency-audit evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: >-
            security-dependency-audit-${{ github.sha }}-${{ github.run_attempt }}
          path: artifacts/dependency-audit/dependency-audit.json
          if-no-files-found: error

      - name: Report runner telemetry
        if: always() && hashFiles('.github/actions/runner-telemetry/action.yml') != ''
        uses: ./.github/actions/runner-telemetry
        with:
          mode: report
