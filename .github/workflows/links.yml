name: Repository link check

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check repository links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          lycheeVersion: v0.24.2
          args: --config lychee.toml --root-dir '${{ github.workspace }}' .
          fail: true
          failIfEmpty: true
          format: markdown
          jobSummary: true
          output: artifacts/links/report.md
          token: ${{ github.token }}

      - name: Upload link report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: link-report-${{ github.sha }}-${{ github.run_attempt }}
          path: artifacts/links/report.md
          if-no-files-found: warn
          retention-days: 14
