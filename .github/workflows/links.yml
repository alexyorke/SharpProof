name: Repository link check

on:
  workflow_call:
  schedule:
    - cron: "37 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Require valid repository links and exercise rejection fixtures
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mkdir -p artifacts/links
          docker run --rm --platform linux/amd64 --env GITHUB_TOKEN \
            --mount "type=bind,source=$GITHUB_WORKSPACE,target=/input,readonly" \
            --mount "type=bind,source=$GITHUB_WORKSPACE/artifacts/links,target=/reports" \
            --workdir /input --entrypoint /bin/sh \
            lycheeverse/lychee:0.24.2@sha256:e2d19e57cf6ab037026f20b8e449a1f30d9d7f81eef4194763aab2eab20bd28d \
            scripts/Test-SharpProofLinks.sh /reports/report.md

      - name: Publish link summary
        if: always()
        run: |
          if [[ -f artifacts/links/report.md ]]; then
            cat artifacts/links/report.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload link report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: link-report-${{ github.sha }}-${{ github.run_attempt }}
          path: artifacts/links/report.md
          if-no-files-found: warn
          retention-days: 14
