name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sharpproof-release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  COMPOSE_PROJECT_NAME: sharpproof-release-${{ github.run_id }}-${{ github.run_attempt }}
  SHARPPROOF_CONTAINER_CPU_LIMIT: 4

jobs:
  preflight:
    name: Authorize release commit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require canonical master CI for the exact tagged commit
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 eng/scripts/Check-ReleaseTrust.py

  package:
    name: Pack and test packages
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Check the tag matches the checked-in package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          version="$(pwsh -NoLogo -NoProfile -Command 'Import-Module ./eng/scripts/SharpProof.ReleaseConfiguration.psm1; Get-SharpProofEffectivePackageVersion -RepositoryRoot .')"
          test "v${version}" = "${GITHUB_REF_NAME}"

      # Fail before the image push and the long package job, not at publish.
      - name: Check the publish settings exist
        if: startsWith(github.ref, 'refs/tags/v') && github.repository == 'alexyorke/SharpProof'
        env:
          NUGET_USER: ${{ vars.NUGET_USER }}
        run: |
          if [[ -z "$NUGET_USER" ]]; then
            echo "::error::Set the NUGET_USER repository variable to the nuget.org account that owns the trusted-publishing policy."
            exit 1
          fi

      # A tag publishes the changelog section for its version; a dispatch
      # exercises the same extraction on the Unreleased section.
      - name: Extract release notes from the changelog
        run: |
          set -euo pipefail
          heading=Unreleased
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then heading="${GITHUB_REF_NAME#v}"; fi
          mkdir -p artifacts/release-notes
          awk -v heading="$heading" '/^## / { found = ($2 == heading); next } found' CHANGELOG.md |
            sed -E "s#\]\(([^)\#:]+)(\#[^)]*)?\)#](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_SHA}/\1\2)#g" \
            > artifacts/release-notes/notes.md
          if ! grep -q '[^[:space:]]' artifacts/release-notes/notes.md; then
            # Unreleased is empty once the version heading is cut, and the
            # dry run of that commit must still reach packaging.
            if [[ "$heading" == Unreleased ]]; then
              echo "No unreleased changes." > artifacts/release-notes/notes.md
            else
              echo "::error::CHANGELOG.md has no '## ${heading}' section. Cut the version heading before tagging."
              exit 1
            fi
          fi

      - uses: ./.github/actions/setup-tooling

      - name: ./ci.sh release-packages
        run: ./ci.sh release-packages

      - name: Retain scan evidence on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-scan-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/release-evidence/*.json
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nuget-packages-${{ github.sha }}
          path: |
            artifacts/container-packages/*.nupkg
            artifacts/container-packages/*.snupkg
            artifacts/tool-packages/*.nupkg
            artifacts/consumer-image/reference.txt
            artifacts/release-notes/notes.md
            artifacts/release-evidence/*.json
          if-no-files-found: error
          # A full re-run replaces the first attempt's packages; a re-run of
          # failed jobs alone finds them under the same name.
          overwrite: true
      - name: Retain the exact consumer image for approved publication
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: consumer-image-${{ github.sha }}
          path: artifacts/consumer-image/image.tar
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
          overwrite: true

  # Every other job runs on Linux; these load the Windows and macOS payloads.
  native-smoke:
    name: Native smoke (${{ matrix.os }})
    needs: package
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nuget-packages-${{ github.sha }}
          path: nupkgs

      - name: Prove and refute one contract with the packed packages
        shell: pwsh
        run: ./eng/scripts/Test-SharpProofNativeSmoke.ps1 -PackageSource nupkgs/container-packages

  publish:
    name: Publish approved image, packages, and provenance
    needs: [preflight, package, native-smoke]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && github.repository == 'alexyorke/SharpProof'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: nuget.org
    permissions:
      contents: write
      id-token: write
      packages: write
      attestations: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Recheck release eligibility after environment approval
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 eng/scripts/Check-ReleaseTrust.py
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nuget-packages-${{ github.sha }}
          path: nupkgs

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: consumer-image-${{ github.sha }}
          path: consumer-image

      - name: Publish the scanned OCI archive without changing its digest
        id: image
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repository=ghcr.io/alexyorke/sharpproof-preview
          reference="$(cat nupkgs/consumer-image/reference.txt)"
          digest="${reference#"$repository@"}"
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          skopeo="$(jq -r .skopeo eng/security/release-tools.json)"
          actual="$(docker run --rm -v "$PWD/consumer-image:/image:ro" "$skopeo" inspect --format '{{.Digest}}' oci-archive:/image/image.tar)"
          test "$actual" = "$digest"
          # The temporary auth file is mounted read-only and never retained.
          auth="$(mktemp -d)"
          trap 'rm -rf "$auth"' EXIT
          printf '%s' "$GH_TOKEN" | docker run --rm -i -v "$auth:/auth" "$skopeo" login \
            --authfile /auth/config.json -u "$GITHUB_ACTOR" --password-stdin ghcr.io
          docker run --rm -v "$auth:/auth:ro" -v "$PWD/consumer-image:/image:ro" "$skopeo" copy \
            --authfile /auth/config.json --preserve-digests oci-archive:/image/image.tar \
            "docker://$repository:${GITHUB_REF_NAME#v}"
          echo "name=$repository" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Attest packages, symbols, and SBOMs
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            nupkgs/**/*.nupkg
            nupkgs/**/*.snupkg
            nupkgs/release-evidence/*.json
            nupkgs/consumer-image/reference.txt

      - name: Attest the exact consumer image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

      - name: Exchange GitHub OIDC token for a temporary NuGet key
        id: nuget-login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Push packages and symbols
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          set -euo pipefail
          for package in $(find nupkgs -name '*.nupkg' | sort); do
            dotnet nuget push "$package" --source https://api.nuget.org/v3/index.json \
              --api-key "$NUGET_API_KEY" --skip-duplicate
          done

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          flags=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then flags+=(--prerelease); fi
          mapfile -t assets < <(find nupkgs -name '*.nupkg' -o -name '*.snupkg' -o -name '*.json' -o -name reference.txt | sort)
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --draft --target "$GITHUB_SHA" --notes-file nupkgs/release-notes/notes.md "${flags[@]}" "${assets[@]}"
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false
