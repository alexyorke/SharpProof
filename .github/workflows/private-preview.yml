name: Qualify private preview candidate

on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: Approved exact public master commit
        type: string
        required: true
      workflow_commit:
        description: Approved exact private orchestration commit (must equal this workflow SHA)
        type: string
        required: true
permissions:
  contents: read

concurrency:
  group: sharpproof-official-private-preview-1
  cancel-in-progress: false

env:
  SHARPPROOF_PRIVATE_PREVIEW: "true"
  SHARPPROOF_CI_PACKAGE_VERSION: ""
  SHARPPROOF_SOURCE_REPOSITORY: alexyorke/SharpProof
  SHARPPROOF_REPOSITORY_URL: https://github.com/alexyorke/SharpProof-preview
  SHARPPROOF_WORKFLOW_COMMIT: ${{ github.workflow_sha }}
  COMPOSE_PROJECT_NAME: sharpproof-private-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
  SHARPPROOF_CONTAINER_CPU_LIMIT: 4

jobs:
  approved-source:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
      - name: Verify approved public source and private workflow identities
        id: preflight
        env:
          GH_TOKEN: ${{ github.token }}
          APPROVED_SOURCE: ${{ inputs.source_commit }}
          APPROVED_WORKFLOW: ${{ inputs.workflow_commit }}
        shell: pwsh
        run: >-
          ./eng/scripts/Test-SharpProofPrivatePreviewSource.ps1
          -SourceCommit $env:APPROVED_SOURCE -WorkflowCommit $env:APPROVED_WORKFLOW
          -OutputPath private-source-qualification.json -GitHubOutputPath $env:GITHUB_OUTPUT
      - name: Mirror the exact public source commit without changing its identity
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_COMMIT: ${{ steps.preflight.outputs.source_commit }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REPOSITORY" == alexyorke/SharpProof-preview && "$SOURCE_COMMIT" =~ ^[a-f0-9]{40}$ ]]
          export GIT_ASKPASS="$GITHUB_WORKSPACE/eng/release/private-preview/git-askpass.sh" GIT_TERMINAL_PROMPT=0
          chmod 700 "$GIT_ASKPASS"
          git fetch --no-tags https://github.com/alexyorke/SharpProof.git "$SOURCE_COMMIT"
          [[ "$(git rev-parse FETCH_HEAD)" == "$SOURCE_COMMIT" ]]
          target="refs/heads/source/$SOURCE_COMMIT"
          current="$(git -c credential.helper= ls-remote origin "$target" | cut -f1)"
          [[ -z "$current" || "$current" == "$SOURCE_COMMIT" ]]
          if [[ -z "$current" ]]; then git -c credential.helper= push origin "$SOURCE_COMMIT:$target"; fi
          [[ "$(git -c credential.helper= ls-remote origin "$target" | cut -f1)" == "$SOURCE_COMMIT" ]]
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: source-receipt
        with:
          name: private-source-qualification-${{ github.run_id }}-${{ github.run_attempt }}
          path: private-source-qualification.json
          if-no-files-found: error
    outputs:
      source_commit: ${{ steps.preflight.outputs.source_commit }}
      workflow_commit: ${{ steps.preflight.outputs.workflow_commit }}
      source_receipt_id: ${{ steps.source-receipt.outputs.artifact-id }}

  qualified-packages:
    needs: approved-source
    uses: ./.github/workflows/package-consumers.yml
    with:
      private_preview: true
      source_commit: ${{ needs.approved-source.outputs.source_commit }}
      workflow_commit: ${{ github.workflow_sha }}
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

  private-candidate:
    needs: [approved-source, qualified-packages]
    runs-on: ubuntu-latest
    env:
      SHARPPROOF_SOURCE_COMMIT: ${{ needs.approved-source.outputs.source_commit }}
    permissions:
      contents: read
      actions: read
    steps:
      - uses: docker/setup-docker-action@e43656e248c0bd0647d3f5c195d116aacf6fcaf4 # v4
        with:
          version: v29.9.2
          daemon-config: '{"features":{"containerd-snapshotter":true}}'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.approved-source.outputs.source_commit }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require checkout to equal the approved immutable source SHA
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SHARPPROOF_SOURCE_COMMIT" =~ ^[a-f0-9]{40}$ ]]
          origin="$(git remote get-url origin)"
          [[ "$origin" == https://github.com/alexyorke/SharpProof-preview || "$origin" == https://github.com/alexyorke/SharpProof-preview.git ]]
          actual="$(git rev-parse HEAD)"
          if [[ "$actual" != "$SHARPPROOF_SOURCE_COMMIT" ]]; then
            echo 'Checkout differs from the approved source; qualification stopped before preparation.' >&2
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: artifacts/private-release-orchestration
          persist-credentials: false
      - name: Require an immutable qualified core-package identity
        shell: bash
        env:
          QUALIFIED_ARTIFACT_ID: ${{ needs.qualified-packages.outputs.package_artifact_id }}
        run: '[[ "$QUALIFIED_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.qualified-packages.outputs.package_artifact_id }}
          path: nupkgs
          merge-multiple: true
      - name: Build the canonical source toolchain without shared caches
        id: prepared
        shell: bash
        run: bash "$GITHUB_WORKSPACE/artifacts/private-release-orchestration/eng/scripts/Prepare-SharpProofPrivatePreview.sh"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.qualified-packages.outputs.tool_artifact_id }}
          path: tool-nupkgs
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.approved-source.outputs.source_receipt_id }},${{ needs.qualified-packages.outputs.qualification_artifact_id }}
          path: private-qualification
          merge-multiple: true
      - name: Build exact private candidate before using any publication secret
        id: consumer
        env:
          WINDOWS_NATIVE_PATH: ${{ steps.prepared.outputs.windows-native-path }}
        shell: bash
        run: |
          set -euo pipefail
          image="ghcr.io/alexyorke/sharpproof-preview:sha-$SHARPPROOF_SOURCE_COMMIT"
          docker buildx build --platform linux/amd64 --file eng/container/Dockerfile \
            --build-context "windows-native=$WINDOWS_NATIVE_PATH" --target consumer \
            --build-arg SHARPPROOF_PACKAGE_VERSION=1.0.0-preview.1 \
            --label "org.opencontainers.image.source=https://github.com/alexyorke/SharpProof-preview" \
            --label "org.opencontainers.image.revision=$SHARPPROOF_SOURCE_COMMIT" \
            --provenance=false --load --metadata-file consumer-image.json --tag "$image" .
          digest="$(jq -r '."containerimage.digest"' consumer-image.json)"
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          echo "reference=ghcr.io/alexyorke/sharpproof-preview@$digest" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Qualify all six exact packages and generated consumers
        env:
          SHARPPROOF_CONSUMER_IMAGE: ${{ steps.consumer.outputs.reference }}
          SHARPPROOF_QUALIFIED_TOOL_PACKAGES: tool-nupkgs
        run: >-
          docker compose run --rm -e SHARPPROOF_CONSUMER_IMAGE -e SHARPPROOF_QUALIFIED_TOOL_PACKAGES
          tooling developer-experience -Configuration Release -PackageSource nupkgs
      - name: Exercise the retained generated Compose project
        env:
          QUALIFIED_CONSUMER_IMAGE: ${{ steps.consumer.outputs.reference }}
        shell: bash
        run: |
          set -euo pipefail
          fixture="$(find artifacts/developer-experience -mindepth 2 -maxdepth 2 -type d -name consumer -print -quit)"
          test -f "$fixture/Native.csproj"
          evidence="$(realpath -e -- "$(dirname "$fixture")")"
          [[ "${evidence%/*}" == "$(realpath -e -- artifacts/developer-experience)" && "${evidence##*/}" =~ ^[a-f0-9]{32}$ ]]
          sudo chown -- "$(id -u):$(id -g)" "$evidence"
          pwsh -NoLogo -NoProfile -File eng/scripts/Test-SharpProofTemplateCompose.ps1 \
            -EvidenceDirectory "$evidence" -ConsumerImage "$QUALIFIED_CONSUMER_IMAGE" \
            -LocalImage "ghcr.io/alexyorke/sharpproof-preview:sha-$SHARPPROOF_SOURCE_COMMIT" -BuildMetadataPath consumer-image.json
          pwsh -NoLogo -NoProfile -File eng/scripts/Test-SharpProofTemplateCompose.ps1 \
            -EvidenceDirectory "$evidence" -ConsumerDirectory workspace-consumer -ConsumerImage "$QUALIFIED_CONSUMER_IMAGE" \
            -LocalImage "ghcr.io/alexyorke/sharpproof-preview:sha-$SHARPPROOF_SOURCE_COMMIT" -BuildMetadataPath consumer-image.json
      - name: Freeze and verify original OCI manifest, config, and layer bytes
        env:
          PRIVATE_CONSUMER_DIGEST: ${{ steps.consumer.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir private-candidate-image
          image="ghcr.io/alexyorke/sharpproof-preview:sha-$SHARPPROOF_SOURCE_COMMIT"
          docker image save --output private-candidate-image/consumer-image.tar "$image"
          pwsh -NoLogo -NoProfile -File artifacts/private-release-orchestration/eng/scripts/Test-SharpProofPrivatePreviewImage.ps1 \
            -ArchivePath private-candidate-image/consumer-image.tar -BuildMetadataPath consumer-image.json \
            -ExpectedDigest "$PRIVATE_CONSUMER_DIGEST" -ExpectedSourceCommit "$SHARPPROOF_SOURCE_COMMIT" \
            -ImageReference "$image" -OutputPath private-candidate-image/image-receipt.json
      - name: Record unsigned private six-package candidate and all qualification evidence
        env:
          PRIVATE_CONSUMER_IMAGE: ${{ steps.consumer.outputs.reference }}
        shell: bash
        run: |
          set -euo pipefail
          fixture="$(find artifacts/developer-experience -mindepth 2 -maxdepth 2 -type d -name packages -print -quit)"
          test -n "$fixture"
          docker compose run --rm -e PRIVATE_DEVELOPER_PACKAGES="$fixture" -e PRIVATE_CONSUMER_IMAGE tooling dev -lc \
            'pwsh -NoLogo -NoProfile -File artifacts/private-release-orchestration/eng/scripts/New-SharpProofPrivatePreviewEvidence.ps1 -CorePackageSource nupkgs -ToolPackageSource tool-nupkgs -DeveloperPackageSource "$PRIVATE_DEVELOPER_PACKAGES" -OutputDirectory artifacts/private-preview -QualificationDirectory private-qualification -ConsumerImage "$PRIVATE_CONSUMER_IMAGE" -ImageArchivePath private-candidate-image/consumer-image.tar -ImageReceiptPath private-candidate-image/image-receipt.json'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: candidate
        with:
          name: private-preview-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/private-preview/
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: private-preview-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/developer-experience/
            consumer-image.json
            private-qualification/
          if-no-files-found: error
          retention-days: 90
