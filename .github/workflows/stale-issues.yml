name: Close Stale Issues
on:
  schedule:
    - cron: "17 8 * * *"
  workflow_dispatch:
permissions:
  issues: write
jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - name: Mark and close stale issues
        uses: actions/stale@v10
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          days-before-issue-stale: 23
          days-before-issue-close: 7
          days-before-pr-stale: -1
          days-before-pr-close: -1
          stale-issue-label: stale
          stale-issue-message: >
            This issue has been automatically marked as stale after 23 days
            with no activity. Comment or update it within 7 days to keep it
            open.
          close-issue-message: >
            This issue was automatically closed after 30 days with no activity.
            If it is still relevant, comment with new details and it can be
            reopened.
          remove-issue-stale-when-updated: true
          exempt-all-issue-assignees: true
          exempt-all-issue-milestones: true
          exempt-issue-labels: pinned,good first issue,help wanted
          operations-per-run: 200
          ascending: true
