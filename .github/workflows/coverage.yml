name: Coverage

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  SHARPPROOF_CI_PACKAGE_VERSION: ${{ format('0.0.0-ci.{0}.{1}', github.run_id, github.run_attempt) }}
  COMPOSE_PROJECT_NAME: sharpproof-coverage-${{ github.run_id }}-${{ github.run_attempt }}
  SHARPPROOF_CONTAINER_CPU_LIMIT: 4
  # Public Linux runners have 16 GB RAM; keep the container below that.
  SHARPPROOF_CONTAINER_MEMORY_LIMIT: 12g
  SHARPPROOF_TMPFS_SIZE: 4g

jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: ./.github/actions/prepare-qualified-packages
        with:
          download-packages: "false"

      - name: Collect line coverage of the C# sources
        run: docker compose run --rm tooling coverage -Configuration Release

      - name: Publish the coverage summary
        if: always()
        run: |
          if [[ -f artifacts/coverage/summary.md ]]; then
            cat artifacts/coverage/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload Cobertura reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            artifacts/coverage/**/*.cobertura.xml
            artifacts/coverage/summary.md
          if-no-files-found: warn
          retention-days: 14
