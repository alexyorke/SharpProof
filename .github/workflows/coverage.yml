name: Coverage

on:
  push:
    branches: [master]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  coverage:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup required .NET SDKs
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "8.0.x"
          global-json-file: global.json

      - name: Restore and build
        shell: pwsh
        run: |
          .\scripts\Invoke-SharpProofDotnet.ps1 restore SharpProof.sln
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\scripts\Invoke-SharpProofDotnet.ps1 `
            -MemoryLimitMb 8192 `
            -TimeoutSeconds 600 `
            build SharpProof.sln -c Release --no-restore
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Collect aggregate coverage
        shell: pwsh
        run: |
          .\scripts\Invoke-SharpProofDotnet.ps1 `
            -MemoryLimitMb 12288 `
            -TimeoutSeconds 1200 `
            test SharpProof.Dev.Tests.slnf `
            -c Release `
            --no-build `
            --filter 'TestCategory!=Performance' `
            --collect "XPlat Code Coverage" `
            --results-directory artifacts/coverage

      - name: Enforce project and changed C# TCB coverage
        shell: pwsh
        run: |
          $comparisonRef = if ('${{ github.event_name }}' -eq 'pull_request') {
            '${{ github.event.pull_request.base.sha }}'
          } elseif ('${{ github.event.before }}' -match '^[0-9a-f]{40}$' -and
                    '${{ github.event.before }}' -ne ('0' * 40)) {
            '${{ github.event.before }}'
          } else {
            'HEAD^'
          }
          .\scripts\Test-SharpProofCoverage.ps1 `
            -CoverageRoot artifacts/coverage `
            -ComparisonRef $comparisonRef `
            -SummaryPath artifacts/coverage/SharpProof.coverage.json

      - name: Upload coverage evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: coverage
          path: artifacts/coverage
          if-no-files-found: error
          retention-days: 30
