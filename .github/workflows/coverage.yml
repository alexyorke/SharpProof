name: Container coverage

on:
  push:
    branches: [master]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  COMPOSE_PROJECT_NAME: sharpproof-coverage-${{ github.run_id }}-${{ github.run_attempt }}
  SHARPPROOF_CONTAINER_CPU_LIMIT: 4

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Select changed-TCB comparison commit
        run: |
          if [[ '${{ github.event_name }}' == 'pull_request' ]]; then
            comparison='${{ github.event.pull_request.base.sha }}'
          elif [[ '${{ github.event.before }}' =~ ^[0-9a-f]{40}$ ]] &&
               [[ '${{ github.event.before }}' != '0000000000000000000000000000000000000000' ]]; then
            comparison='${{ github.event.before }}'
          else
            comparison='HEAD^'
          fi
          echo "SHARPPROOF_COVERAGE_COMPARISON_REF=${comparison}" >> "$GITHUB_ENV"

      - name: Build the pinned toolchain
        uses: ./.github/actions/build-tooling

      - name: Collect and enforce container coverage
        run: >-
          docker compose run --rm
          -e SHARPPROOF_COVERAGE_COMPARISON_REF
          tooling coverage -Configuration Release

      - name: Upload coverage evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-${{ github.sha }}-${{ github.run_attempt }}
          path: artifacts/coverage
          if-no-files-found: error
          retention-days: 30
