name: Container coverage

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
    inputs:
      comparison_ref:
        description: Exact commit or named ref for changed-TCB comparison
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  COMPOSE_PROJECT_NAME: sharpproof-coverage-${{ github.run_id }}-${{ github.run_attempt }}
  SHARPPROOF_CONTAINER_CPU_LIMIT: 4

# Twelve shards retain the complete selection: split corpus workflows, isolate
# Analyzer and the Attributes/Fuzz console tail, retain both Worker halves,
# and run all remaining projects plus four package method partitions.
# The required coverage gate authenticates every artifact, verifies the complete
# task/case partition, and preserves independent authority, MAX merging, floors,
# and changed-TCB enforcement.
jobs:
  coverage-shard:
    name: coverage shard (${{ matrix.shard }})
    runs-on: ubuntu-latest
    outputs:
      semantic-gates-corpus-a-attempt: ${{ steps.shard-identity.outputs.semantic-gates-corpus-a-attempt }}
      semantic-gates-corpus-b-attempt: ${{ steps.shard-identity.outputs.semantic-gates-corpus-b-attempt }}
      semantic-gates-shards-attempt: ${{ steps.shard-identity.outputs.semantic-gates-shards-attempt }}
      semantic-worker-a-attempt: ${{ steps.shard-identity.outputs.semantic-worker-a-attempt }}
      semantic-worker-b-2-attempt: ${{ steps.shard-identity.outputs.semantic-worker-b-2-attempt }}
      semantic-worker-b-3-attempt: ${{ steps.shard-identity.outputs.semantic-worker-b-3-attempt }}
      semantic-analyzer-attempt: ${{ steps.shard-identity.outputs.semantic-analyzer-attempt }}
      semantic-projects-rest-attempt: ${{ steps.shard-identity.outputs.semantic-projects-rest-attempt }}
      semantic-extras-attempt: ${{ steps.shard-identity.outputs.semantic-extras-attempt }}
      package-0-attempt: ${{ steps.shard-identity.outputs.package-0-attempt }}
      package-1-attempt: ${{ steps.shard-identity.outputs.package-1-attempt }}
      package-2-attempt: ${{ steps.shard-identity.outputs.package-2-attempt }}
      package-3-attempt: ${{ steps.shard-identity.outputs.package-3-attempt }}
    strategy:
      fail-fast: false
      matrix:
        shard:
          - semantic-gates-corpus-a
          - semantic-gates-corpus-b
          - semantic-gates-shards
          - semantic-worker-a
          - semantic-worker-b-2
          - semantic-worker-b-3
          - semantic-analyzer
          - semantic-projects-rest
          - semantic-extras
          - package-0
          - package-1
          - package-2
          - package-3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: ./.github/actions/prepare-qualified-packages
        with:
          download-packages: "false"

      - name: Collect ${{ matrix.shard }} coverage shard
        run: >-
          docker compose run --rm -e GITHUB_RUN_ID
          tooling coverage-shard -Configuration Release
          -CoveragePhase ${{ matrix.shard }}

      # One artifact per shard holds artifacts/coverage/<shard> and the
      # shard's uniquely named timing profiles under artifacts/timings.
      - name: Upload coverage shard and timing profile
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-shard-${{ matrix.shard }}-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            artifacts/coverage/${{ matrix.shard }}
            artifacts/timings/*-coverage.json
          if-no-files-found: error
          retention-days: 30

      # A failed-only rerun retains successful matrix jobs from earlier attempts.
      # Publish unique matrix outputs only after both uploads succeed, so the
      # gate selects each successful job's evidence without deleting old attempts.
      - name: Record successful shard artifact attempt
        id: shard-identity
        env:
          SHARPPROOF_SHARD: ${{ matrix.shard }}
        run: echo "${SHARPPROOF_SHARD}-attempt=${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"

      - name: Report runner telemetry
        if: always() && hashFiles('.github/actions/runner-telemetry/action.yml') != ''
        uses: ./.github/actions/runner-telemetry
        with:
          mode: report
          name: ${{ github.job }}-${{ matrix.shard }}

  coverage-gate:
    name: coverage
    # Keep the existing required-check identity and explicitly reject failed
    # or cancelled prerequisites; a skipped job can satisfy required checks.
    if: always()
    needs: coverage-shard
    runs-on: ubuntu-latest
    steps:
      - name: Require every successful coverage shard
        env:
          SHARPPROOF_SHARD_RESULT: ${{ needs.coverage-shard.result }}
        run: |
          if [[ "$SHARPPROOF_SHARD_RESULT" != success ]]; then
            echo "Coverage shards did not all succeed: $SHARPPROOF_SHARD_RESULT" >&2
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Select changed-TCB comparison commit
        env:
          SHARPPROOF_REQUESTED_COMPARISON_REF: ${{ inputs.comparison_ref }}
        run: |
          if [[ '${{ github.event_name }}' == 'pull_request' ]]; then
            candidate='${{ github.event.pull_request.base.sha }}'
          elif [[ '${{ github.event.before }}' =~ ^[0-9a-f]{40}$ ]] &&
               [[ '${{ github.event.before }}' != '0000000000000000000000000000000000000000' ]]; then
            candidate='${{ github.event.before }}'
          elif [[ '${{ github.event_name }}' == 'workflow_dispatch' ]] &&
               [[ -n "${SHARPPROOF_REQUESTED_COMPARISON_REF}" ]]; then
            candidate="${SHARPPROOF_REQUESTED_COMPARISON_REF}"
          else
            echo 'No durable coverage comparison authority was supplied.' >&2
            exit 1
          fi
          comparison="$(git rev-parse --verify "${candidate}^{commit}")"
          [[ "${comparison}" =~ ^[0-9a-f]{40}$ ]] || {
            echo 'Coverage comparison did not resolve to one exact commit.' >&2
            exit 1
          }
          echo "SHARPPROOF_COVERAGE_COMPARISON_REF=${comparison}" >> "$GITHUB_ENV"

      - uses: ./.github/actions/prepare-qualified-packages
        with:
          download-packages: "false"

      - name: Download semantic-gates-corpus-a coverage shard
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-shard-semantic-gates-corpus-a-${{ github.sha }}-${{ needs.coverage-shard.outputs.semantic-gates-corpus-a-attempt }}
          path: artifacts

      - name: Download semantic-gates-corpus-b coverage shard
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-shard-semantic-gates-corpus-b-${{ github.sha }}-${{ needs.coverage-shard.outputs.semantic-gates-corpus-b-attempt }}
          path: artifacts

      - name: Download semantic-gates-shards coverage shard
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-shard-semantic-gates-shards-${{ github.sha }}-${{ needs.coverage-shard.outputs.semantic-gates-shards-attempt }}
          path: artifacts

      - name: Download semantic-worker-a coverage shard
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-shard-semantic-worker-a-${{ github.sha }}-${{ needs.coverage-shard.outputs.semantic-worker-a-attempt }}
          path: artifacts

      - name: Download semantic-worker-b-2 coverage shard
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-shard-semantic-worker-b-2-${{ github.sha }}-${{ needs.coverage-shard.outputs.semantic-worker-b-2-attempt }}
          path: artifacts

      - name: Download semantic-worker-b-3 coverage shard
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-shard-semantic-worker-b-3-${{ github.sha }}-${{ needs.coverage-shard.outputs.semantic-worker-b-3-attempt }}
          path: artifacts

      - name: Download semantic-analyzer coverage shard
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-shard-semantic-analyzer-${{ github.sha }}-${{ needs.coverage-shard.outputs.semantic-analyzer-attempt }}
          path: artifacts

      - name: Download semantic-projects-rest coverage shard
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-shard-semantic-projects-rest-${{ github.sha }}-${{ needs.coverage-shard.outputs.semantic-projects-rest-attempt }}
          path: artifacts

      - name: Download semantic-extras coverage shard
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-shard-semantic-extras-${{ github.sha }}-${{ needs.coverage-shard.outputs.semantic-extras-attempt }}
          path: artifacts

      - name: Download package-0 coverage shard
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-shard-package-0-${{ github.sha }}-${{ needs.coverage-shard.outputs.package-0-attempt }}
          path: artifacts

      - name: Download package-1 coverage shard
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-shard-package-1-${{ github.sha }}-${{ needs.coverage-shard.outputs.package-1-attempt }}
          path: artifacts

      - name: Download package-2 coverage shard
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-shard-package-2-${{ github.sha }}-${{ needs.coverage-shard.outputs.package-2-attempt }}
          path: artifacts

      - name: Download package-3 coverage shard
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-shard-package-3-${{ github.sha }}-${{ needs.coverage-shard.outputs.package-3-attempt }}
          path: artifacts

      - name: Merge and enforce container coverage
        run: >-
          docker compose run --rm -e GITHUB_RUN_ID
          -e SHARPPROOF_COVERAGE_COMPARISON_REF
          tooling coverage-gate -Configuration Release

      - name: Upload coverage evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            artifacts/coverage
            artifacts/timings/*-coverage.json
          if-no-files-found: error
          retention-days: 30

      - name: Report runner telemetry
        if: always() && hashFiles('.github/actions/runner-telemetry/action.yml') != ''
        uses: ./.github/actions/runner-telemetry
        with:
          mode: report
