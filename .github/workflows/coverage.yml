name: Container coverage

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
    inputs:
      comparison_ref:
        description: Exact commit or named ref for changed-TCB comparison
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  SHARPPROOF_CI_PACKAGE_VERSION: ${{ !startsWith(github.ref, 'refs/tags/v') && format('0.0.0-ci.{0}.{1}', github.run_id, github.run_attempt) || '' }}
  COMPOSE_PROJECT_NAME: sharpproof-coverage-${{ github.run_id }}-${{ github.run_attempt }}
  SHARPPROOF_CONTAINER_CPU_LIMIT: 4
  # Public Linux runners have 16 GB RAM. Keep the container and its charged
  # scratch below that host capacity so Docker enforces the resource boundary.
  SHARPPROOF_CONTAINER_MEMORY_LIMIT: 12g
  SHARPPROOF_TMPFS_SIZE: 4g

# Fifteen shards retain the complete selection: split corpus workflows and
# Worker A4 fixtures, isolate Analyzer and the Attributes/Fuzz console tail,
# and run every other project plus four package method partitions.
# The required coverage gate authenticates every artifact, verifies the complete
# task/case partition, and preserves independent authority, MAX merging, floors,
# and changed-TCB enforcement.
jobs:
  coverage-shard:
    name: coverage shard (${{ matrix.shard }})
    runs-on: ubuntu-latest
    outputs:
      semantic-gates-corpus-a-attempt: ${{ steps.shard-identity.outputs.semantic-gates-corpus-a-attempt }}
      semantic-gates-corpus-a-artifact-id: ${{ steps.shard-identity.outputs.semantic-gates-corpus-a-artifact-id }}
      semantic-gates-corpus-b-attempt: ${{ steps.shard-identity.outputs.semantic-gates-corpus-b-attempt }}
      semantic-gates-corpus-b-artifact-id: ${{ steps.shard-identity.outputs.semantic-gates-corpus-b-artifact-id }}
      semantic-gates-shards-attempt: ${{ steps.shard-identity.outputs.semantic-gates-shards-attempt }}
      semantic-gates-shards-artifact-id: ${{ steps.shard-identity.outputs.semantic-gates-shards-artifact-id }}
      semantic-worker-a-1-attempt: ${{ steps.shard-identity.outputs.semantic-worker-a-1-attempt }}
      semantic-worker-a-4a-attempt: ${{ steps.shard-identity.outputs.semantic-worker-a-4a-attempt }}
      semantic-worker-a-4b-attempt: ${{ steps.shard-identity.outputs.semantic-worker-a-4b-attempt }}
      semantic-worker-a-1-artifact-id: ${{ steps.shard-identity.outputs.semantic-worker-a-1-artifact-id }}
      semantic-worker-a-4a-artifact-id: ${{ steps.shard-identity.outputs.semantic-worker-a-4a-artifact-id }}
      semantic-worker-a-4b-artifact-id: ${{ steps.shard-identity.outputs.semantic-worker-a-4b-artifact-id }}
      semantic-worker-b-2-attempt: ${{ steps.shard-identity.outputs.semantic-worker-b-2-attempt }}
      semantic-worker-b-2-artifact-id: ${{ steps.shard-identity.outputs.semantic-worker-b-2-artifact-id }}
      semantic-worker-b-3-attempt: ${{ steps.shard-identity.outputs.semantic-worker-b-3-attempt }}
      semantic-worker-b-3-artifact-id: ${{ steps.shard-identity.outputs.semantic-worker-b-3-artifact-id }}
      semantic-analyzer-attempt: ${{ steps.shard-identity.outputs.semantic-analyzer-attempt }}
      semantic-analyzer-artifact-id: ${{ steps.shard-identity.outputs.semantic-analyzer-artifact-id }}
      semantic-projects-rest-attempt: ${{ steps.shard-identity.outputs.semantic-projects-rest-attempt }}
      semantic-projects-rest-artifact-id: ${{ steps.shard-identity.outputs.semantic-projects-rest-artifact-id }}
      semantic-extras-attempt: ${{ steps.shard-identity.outputs.semantic-extras-attempt }}
      semantic-extras-artifact-id: ${{ steps.shard-identity.outputs.semantic-extras-artifact-id }}
      package-0-attempt: ${{ steps.shard-identity.outputs.package-0-attempt }}
      package-0-artifact-id: ${{ steps.shard-identity.outputs.package-0-artifact-id }}
      package-1-attempt: ${{ steps.shard-identity.outputs.package-1-attempt }}
      package-1-artifact-id: ${{ steps.shard-identity.outputs.package-1-artifact-id }}
      package-2-attempt: ${{ steps.shard-identity.outputs.package-2-attempt }}
      package-2-artifact-id: ${{ steps.shard-identity.outputs.package-2-artifact-id }}
      package-3-attempt: ${{ steps.shard-identity.outputs.package-3-attempt }}
      package-3-artifact-id: ${{ steps.shard-identity.outputs.package-3-artifact-id }}
    strategy:
      fail-fast: false
      matrix:
        shard:
          - semantic-gates-corpus-a
          - semantic-gates-corpus-b
          - semantic-gates-shards
          - semantic-worker-a-1
          - semantic-worker-a-4a
          - semantic-worker-a-4b
          - semantic-worker-b-2
          - semantic-worker-b-3
          - semantic-analyzer
          - semantic-projects-rest
          - semantic-extras
          - package-0
          - package-1
          - package-2
          - package-3
    env:
      SHARPPROOF_COVERAGE_SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: ./.github/actions/prepare-qualified-packages
        with:
          download-packages: "false"

      - name: Collect ${{ matrix.shard }} coverage shard
        run: >-
          docker compose run
          --name "${COMPOSE_PROJECT_NAME}-${SHARPPROOF_COVERAGE_SHARD}"
          -e GITHUB_RUN_ID
          tooling coverage-shard -Configuration Release
          -CoveragePhase "$SHARPPROOF_COVERAGE_SHARD"

      # Retain the exact task container until Docker's terminal state is saved.
      # This records Docker evidence without adding host process-memory probes.
      - name: Record coverage container termination
        if: always()
        run: |
          task_container="${COMPOSE_PROJECT_NAME}-${SHARPPROOF_COVERAGE_SHARD}"
          trap 'docker rm --force "$task_container" >/dev/null 2>&1 || true' EXIT
          state_dir="${RUNNER_TEMP}/sharpproof-container-state"
          state_file="${state_dir}/${SHARPPROOF_COVERAGE_SHARD}.json"
          mkdir -p "$state_dir"
          if docker inspect --format \
            '{"exitCode":{{.State.ExitCode}},"oomKilled":{{.State.OOMKilled}},"error":{{json .State.Error}}}' \
            "$task_container" > "$state_file"; then
            cat "$state_file"
          else
            printf '{"available":false}\n' > "$state_file"
          fi

      - name: Upload coverage container termination
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-container-${{ matrix.shard }}-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/sharpproof-container-state/*.json
          if-no-files-found: error
          retention-days: 30

      # One artifact per shard holds artifacts/coverage/<shard> and the
      # shard's uniquely named timing profiles under artifacts/timings.
      - name: Upload coverage shard and timing profile
        id: shard-evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-shard-${{ matrix.shard }}-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            artifacts/coverage/${{ matrix.shard }}
            artifacts/timings/*-coverage.json
          if-no-files-found: error
          retention-days: 30

      # A failed-only rerun retains successful matrix jobs from earlier attempts.
      # Publish unique matrix outputs only after both uploads succeed, so the
      # gate selects each successful job's evidence without deleting old attempts.
      - name: Record successful shard artifact attempt
        id: shard-identity
        env:
          SHARPPROOF_SHARD: ${{ matrix.shard }}
          SHARPPROOF_ARTIFACT_ID: ${{ steps.shard-evidence.outputs.artifact-id }}
        run: |
          set -euo pipefail
          [[ "$SHARPPROOF_ARTIFACT_ID" =~ ^[0-9]+$ ]]
          echo "${SHARPPROOF_SHARD}-attempt=${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
          echo "${SHARPPROOF_SHARD}-artifact-id=${SHARPPROOF_ARTIFACT_ID}" >> "$GITHUB_OUTPUT"

      - name: Report runner telemetry
        if: always() && hashFiles('.github/actions/runner-telemetry/action.yml') != ''
        uses: ./.github/actions/runner-telemetry
        with:
          mode: report
          name: ${{ github.job }}-${{ matrix.shard }}

  coverage-gate:
    name: coverage
    # Keep the existing required-check identity and explicitly reject failed
    # or cancelled prerequisites; a skipped job can satisfy required checks.
    if: always()
    needs: coverage-shard
    runs-on: ubuntu-latest
    steps:
      - name: Require every successful coverage shard
        env:
          SHARPPROOF_SHARD_RESULT: ${{ needs.coverage-shard.result }}
        run: |
          if [[ "$SHARPPROOF_SHARD_RESULT" != success ]]; then
            echo "Coverage shards did not all succeed: $SHARPPROOF_SHARD_RESULT" >&2
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Select changed-TCB comparison commit
        env:
          SHARPPROOF_REQUESTED_COMPARISON_REF: ${{ inputs.comparison_ref }}
        run: |
          if [[ '${{ github.event_name }}' == 'pull_request' ]]; then
            candidate='${{ github.event.pull_request.base.sha }}'
          elif [[ '${{ github.event.before }}' =~ ^[0-9a-f]{40}$ ]] &&
               [[ '${{ github.event.before }}' != '0000000000000000000000000000000000000000' ]]; then
            candidate='${{ github.event.before }}'
          elif [[ '${{ github.event_name }}' == 'workflow_dispatch' ]] &&
               [[ -n "${SHARPPROOF_REQUESTED_COMPARISON_REF}" ]]; then
            candidate="${SHARPPROOF_REQUESTED_COMPARISON_REF}"
          else
            echo 'No durable coverage comparison authority was supplied.' >&2
            exit 1
          fi
          comparison="$(git rev-parse --verify "${candidate}^{commit}")"
          [[ "${comparison}" =~ ^[0-9a-f]{40}$ ]] || {
            echo 'Coverage comparison did not resolve to one exact commit.' >&2
            exit 1
          }
          echo "SHARPPROOF_COVERAGE_COMPARISON_REF=${comparison}" >> "$GITHUB_ENV"

      - uses: ./.github/actions/prepare-qualified-packages
        with:
          download-packages: "false"

      # Download exact immutable IDs concurrently, retaining each successful
      # producer's attempt across failed-only reruns. Never use a broad pattern.
      - name: Require exact shard artifact identities
        id: shard-artifacts
        env:
          SHARPPROOF_SHARD_OUTPUTS: ${{ toJSON(needs.coverage-shard.outputs) }}
        run: |
          python3 - <<'PY'
          import json, os
          outputs = json.loads(os.environ['SHARPPROOF_SHARD_OUTPUTS'])
          attempts = {key.removesuffix('-attempt'): value for key, value in outputs.items() if key.endswith('-attempt')}
          artifacts = {key.removesuffix('-artifact-id'): value for key, value in outputs.items() if key.endswith('-artifact-id')}
          if len(attempts) != 15 or artifacts.keys() != attempts.keys():
              raise SystemExit('Every coverage shard must supply its producer attempt and immutable artifact ID.')
          if any(not str(value).isdigit() or int(value) < 1 for value in [*attempts.values(), *artifacts.values()]):
              raise SystemExit('Coverage producer identities must be positive integers.')
          if len(set(artifacts.values())) != 15:
              raise SystemExit('Coverage shards must have distinct immutable artifact IDs.')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write('artifact-ids=' + ','.join(artifacts.values()) + '\n')
          PY

      - name: Download exact coverage shards
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ steps.shard-artifacts.outputs.artifact-ids }}
          merge-multiple: true
          path: artifacts

      - name: Merge and enforce container coverage
        run: >-
          docker compose run --rm -e GITHUB_RUN_ID
          -e SHARPPROOF_COVERAGE_COMPARISON_REF
          tooling coverage-gate -Configuration Release

      - name: Upload coverage evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            artifacts/coverage
            artifacts/timings/*-coverage.json
          if-no-files-found: error
          retention-days: 30

      - name: Report runner telemetry
        if: always() && hashFiles('.github/actions/runner-telemetry/action.yml') != ''
        uses: ./.github/actions/runner-telemetry
        with:
          mode: report
