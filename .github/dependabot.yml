# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/eng/lint"
    cooldown:
      default-days: 7
    schedule:
      interval: "weekly"
    groups:
      repository-lint:
        patterns: ["*"]
  - package-ecosystem: "nuget" # See documentation for possible values
    directory: "/" # Location of package manifests
    cooldown:
      default-days: 7
    schedule:
      interval: "daily"
    groups:
      roslyn:
        patterns:
          - "Microsoft.CodeAnalysis.*"
      test-platform:
        patterns:
          - "Microsoft.NET.Test.Sdk"
          - "NUnit"
          - "NUnit3TestAdapter"
    # Analyzer binaries must remain loadable by the documented Roslyn 4.14
    # host. Allow patch servicing, but require an intentional compatibility
    # migration before raising compiler-facing runtime dependency lines.
    ignore:
      - dependency-name: "Microsoft.CodeAnalysis.Common"
        versions:
          - ">= 4.15.0"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-major"
      - dependency-name: "Microsoft.CodeAnalysis.CSharp"
        versions:
          - ">= 4.15.0"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-major"
      - dependency-name: "System.Collections.Immutable"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-major"
  - package-ecosystem: "github-actions"
    directory: "/"
    cooldown:
      default-days: 7
    schedule:
      interval: "weekly"
  - package-ecosystem: "docker"
    directory: "/eng/container"
    schedule:
      interval: "weekly"
    groups:
      toolchain-images:
        patterns: ["*"]
    # Keep minimum-host compatibility lines intentional; service their patches.
    ignore:
      - dependency-name: "mcr.microsoft.com/dotnet/sdk"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "mcr.microsoft.com/dotnet/runtime"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "mcr.microsoft.com/powershell"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
