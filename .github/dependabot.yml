version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/eng/lint"
    cooldown:
      default-days: 7
    schedule:
      interval: "weekly"
    groups:
      repository-lint:
        patterns: ["*"]
  - package-ecosystem: "nuget"
    directory: "/"
    cooldown:
      default-days: 7
    schedule:
      interval: "daily"
    groups:
      roslyn:
        patterns:
          - "Microsoft.CodeAnalysis.*"
      test-platform:
        patterns:
          - "Microsoft.NET.Test.Sdk"
          - "NUnit"
          - "NUnit3TestAdapter"
    # Analyzer binaries must remain loadable by the documented Roslyn 4.14
    # host. Allow patch servicing, but require an intentional compatibility
    # migration before raising compiler-facing runtime dependency lines.
    ignore:
      - dependency-name: "Microsoft.CodeAnalysis.Common"
        versions:
          - ">= 4.15.0"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-major"
      - dependency-name: "Microsoft.CodeAnalysis.CSharp"
        versions:
          - ">= 4.15.0"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-major"
      - dependency-name: "System.Collections.Immutable"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-major"
  - package-ecosystem: "github-actions"
    directory: "/"
    cooldown:
      default-days: 7
    schedule:
      interval: "weekly"
  # Lint stages use literal digest-pinned images. eng/container selects its SDK
  # images through ARG defaults, which Dependabot does not update; bump those
  # with toolchain.json by hand.
  - package-ecosystem: "docker"
    directory: "/eng/lint"
    cooldown:
      default-days: 7
    schedule:
      interval: "weekly"
    groups:
      lint-images:
        patterns: ["*"]
  - package-ecosystem: "docker"
    directory: "/eng/container"
    cooldown:
      default-days: 7
    schedule:
      interval: "weekly"
    groups:
      toolchain-images:
        patterns: ["*"]
    # Keep minimum-host compatibility lines intentional; service their patches.
    ignore:
      - dependency-name: "mcr.microsoft.com/dotnet/sdk"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "mcr.microsoft.com/dotnet/runtime"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "mcr.microsoft.com/powershell"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # ConsumerBaseline.Dockerfile asserts the exact Python version, so a
      # new minor line is a deliberate change made together with that check.
      - dependency-name: "python"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
