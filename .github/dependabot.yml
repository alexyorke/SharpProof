# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
version: 2
updates:
  - package-ecosystem: "nuget" # See documentation for possible values
    directory: "/" # Location of package manifests
    schedule:
      interval: "daily"
    groups:
      roslyn:
        patterns:
          - "Microsoft.CodeAnalysis.*"
      test-platform:
        patterns:
          - "Microsoft.NET.Test.Sdk"
          - "NUnit"
          - "NUnit3TestAdapter"
    # Analyzer binaries must remain loadable by the documented Roslyn 4.14
    # host. Allow patch servicing, but require an intentional compatibility
    # migration before raising compiler-facing runtime dependency lines.
    ignore:
      - dependency-name: "Microsoft.CodeAnalysis.Common"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-major"
      - dependency-name: "Microsoft.CodeAnalysis.Common"
        versions:
          - "[5.0.0,)"
      - dependency-name: "Microsoft.CodeAnalysis.CSharp"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-major"
      - dependency-name: "Microsoft.CodeAnalysis.CSharp"
        versions:
          - "[5.0.0,)"
      - dependency-name: "System.Collections.Immutable"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-major"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
