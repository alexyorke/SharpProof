name: Set up tooling
description: Pull or build the tooling image with ./ci.sh image, caching the Windows Z3 cross-build payload.

# Default-branch cache entries are readable by every pull request;
# pull-request entries stay scoped to their own branch. Scheduled runs build
# the image instead of pulling it. Release tags, and the one scheduled lane
# that sets from-source, compile Z3 from source, so the recipe keeps proving it
# reproduces the pins and releases never ship a cached payload. Only the master
# image job publishes to GHCR, with the one packages: write token in CI, so a
# pull request can read the image but never replace it.
inputs:
  publish:
    description: Push a fresh build to GHCR. Only the master image job sets it.
    default: "false"
  from-source:
    description: Compile the Windows Z3 payload from source instead of restoring it.
    default: "false"
outputs:
  image-name:
    description: Published tooling image repository.
    value: ${{ steps.image.outputs.image-name }}
  image-digest:
    description: Published tooling manifest digest.
    value: ${{ steps.image.outputs.image-digest }}
runs:
  using: composite
  steps:
    - name: Log in to GHCR
      id: registry
      if: github.event_name != 'schedule' && !startsWith(github.ref, 'refs/tags/')
      continue-on-error: true
      shell: bash
      env:
        TOKEN: ${{ github.token }}
        OWNER: ${{ github.repository_owner }}
      run: |
        docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin <<< "$TOKEN"
        echo "registry=ghcr.io/${OWNER,,}/sharpproof-tooling" >> "$GITHUB_OUTPUT"
    - name: Key the Windows Z3 cross-build
      id: key
      shell: bash
      run: |
        echo "key=$(./ci.sh image-key)" >> "$GITHUB_OUTPUT"
        echo "path=${RUNNER_TEMP}/sharpproof-windows-native" >> "$GITHUB_OUTPUT"
    - name: Restore the Windows Z3 cross-build
      id: cache
      if: inputs.from-source != 'true' && !startsWith(github.ref, 'refs/tags/')
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.key.outputs.path }}
        key: ${{ steps.key.outputs.key }}
    - name: Pull or build the tooling image
      id: image
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        SHARPPROOF_WINDOWS_NATIVE_CACHE: ${{ steps.key.outputs.path }}
        SHARPPROOF_IMAGE_REGISTRY: ${{ steps.registry.outputs.registry }}
        SHARPPROOF_IMAGE_PUSH: ${{ inputs.publish == 'true' && '1' || '' }}
      run: ./ci.sh image
    # Concurrent jobs may race to save the same key; a failed save never
    # fails the job.
    - name: Save the Windows Z3 cross-build
      if: steps.cache.outputs.cache-hit != 'true' && !startsWith(github.ref, 'refs/tags/')
      continue-on-error: true
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.key.outputs.path }}
        key: ${{ steps.key.outputs.key }}
