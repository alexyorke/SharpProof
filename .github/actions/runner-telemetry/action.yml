name: Runner telemetry
description: >-
  Temporary CI diagnostics. Samples host CPU, memory, swap, stall pressure, and
  per-container usage on a Linux runner, then publishes a job summary and a CSV
  artifact so runner utilization can be checked. Remove once CI is tuned.

inputs:
  mode:
    description: start begins sampling; report stops it, summarizes, and uploads.
    required: true
  name:
    description: Unique artifact suffix within the run (defaults to the job id).
    required: false
    default: ""
  interval-seconds:
    description: Seconds between samples.
    required: false
    default: "5"

runs:
  using: composite
  steps:
    - name: Start runner sampler
      if: inputs.mode == 'start' && runner.os == 'Linux'
      shell: bash
      env:
        TELEMETRY_INTERVAL: ${{ inputs.interval-seconds }}
      run: |
        dir="${RUNNER_TEMP}/runner-telemetry"
        if [[ -f "${dir}/sampler.pid" ]] && kill -0 "$(cat "${dir}/sampler.pid")" 2>/dev/null; then
          exit 0
        fi
        mkdir -p "${dir}"
        nohup bash "${GITHUB_ACTION_PATH}/sample.sh" "${dir}/samples.csv" "${TELEMETRY_INTERVAL}" \
          >"${dir}/sampler.log" 2>&1 &
        echo $! >"${dir}/sampler.pid"
    - name: Stop runner sampler and summarize
      id: report
      if: inputs.mode == 'report' && runner.os == 'Linux'
      shell: bash
      env:
        TELEMETRY_NAME: ${{ inputs.name != '' && inputs.name || github.job }}
      run: |
        dir="${RUNNER_TEMP}/runner-telemetry"
        if [[ ! -f "${dir}/samples.csv" ]]; then
          echo "No runner telemetry was recorded." >>"${GITHUB_STEP_SUMMARY}"
          exit 0
        fi
        kill "$(cat "${dir}/sampler.pid")" 2>/dev/null || true
        python3 "${GITHUB_ACTION_PATH}/report.py" "${dir}/samples.csv" "${TELEMETRY_NAME}" \
          | tee "${dir}/summary.md" >>"${GITHUB_STEP_SUMMARY}"
        echo "artifact=runner-telemetry-${TELEMETRY_NAME}-${GITHUB_RUN_ATTEMPT}" >>"${GITHUB_OUTPUT}"
    - name: Upload runner telemetry
      if: inputs.mode == 'report' && runner.os == 'Linux' && steps.report.outputs.artifact != ''
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ steps.report.outputs.artifact }}
        path: ${{ runner.temp }}/runner-telemetry
        if-no-files-found: warn
        retention-days: 14
