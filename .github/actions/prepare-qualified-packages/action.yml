name: Prepare qualified packages
description: Download exact package artifacts and build the pinned tooling image.

inputs:
  artifact-id:
    description: Immutable artifact ID emitted by the package job.
    required: false
    default: ""

  download-packages:
    description: Download the qualified package artifact before building tooling.
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Require an immutable qualified artifact identity
      if: inputs.download-packages == 'true'
      shell: bash
      env:
        QUALIFIED_ARTIFACT_ID: ${{ inputs.artifact-id }}
      run: '[[ "$QUALIFIED_ARTIFACT_ID" =~ ^[0-9]+$ ]]'
    - name: Download exact NuGet artifacts
      if: inputs.download-packages == 'true'
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        artifact-ids: ${{ inputs.artifact-id }}
        merge-multiple: true
        path: nupkgs
    - name: Build the pinned Linux amd64 toolchain
      shell: bash
      run: |
        set -euo pipefail
        docker buildx build \
          --platform linux/amd64 \
          --file eng/container/Dockerfile \
          --target toolchain \
          --load \
          --tag "${COMPOSE_PROJECT_NAME}-tooling:local" \
          --build-arg USER_UID=1000 \
          --build-arg USER_GID=1000 \
          --progress plain \
          .
