# Scan link-bearing documentation and web formats throughout the checkout.
extensions = [
  "md", "markdown", "mdx", "qmd", "rmd", "mkd", "mkdn", "mdwn", "mdown", "mkdown",
  "html", "htm", "rst", "txt", "css",
]
# Include .github and other hidden source directories, but never Git metadata.
hidden = true
# The layout gate verifies every pinned Arcade vendor checksum.
exclude_path = ['(^|/)\.git(/|$)', '(^|/)eng/common(/|$)']
# Respect ignore files so build outputs and the report do not become inputs.
no_ignore = false

# Check file/directory targets, Markdown headings, HTML IDs, and web fragments.
include_fragments = "full"
# URLs in documentation examples and code snippets are part of the audit too.
include_verbatim = true

# Preserve the historical notice reference while checking its exact message
# mirror. Message-ID: 41D1C330.8030901@yahoo.co.uk. Debian's host times out in CI.
# The verbatim LLVM license names plain-HTTP llvm.org, which only redirects to
# HTTPS and repeatedly refuses connections from CI runners; check the HTTPS site.
# llvm.org's docs host now refuses CI runners too, so check the LLVM notice's
# DeveloperPolicy#legacy against the page's source in llvm-project, which
# declares the `(legacy)=` label for "Legacy License Structure".
remap = [
  '^https://lists\.debian\.org/debian-legal/2004/12/msg00295\.html$ https://www.mail-archive.com/debian-legal@lists.debian.org/msg29045.html',
  '^http://llvm\.org/?$ https://llvm.org/',
  '^https://llvm\.org/docs/DeveloperPolicy\.html#legacy$ https://raw.githubusercontent.com/llvm/llvm-project/main/llvm/docs/DeveloperPolicy.md',
]

# This normative attestation predicate type is a semantic identifier, not a dereferenceable webpage.
exclude = [
  '^https://spdx\.dev/Document/v2\.3$',
  # An authenticated feed endpoint: it answers 401 without credentials, and
  # link checks must never receive any.
  '^https://nuget\.pkg\.github\.com/alexyorke/index\.json$',
]

timeout = 30
max_retries = 3
retry_wait_time = 5
max_concurrency = 8
host_concurrency = 2
host_request_interval = "250ms"
# Do not reuse cached successes or treat HTTP errors as valid links. A request
# that still times out after the retries above says the host was slow, not
# that the link is broken, so it does not fail the check.
cache = false
accept_timeouts = true
