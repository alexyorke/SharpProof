x-sharpproof-common: &sharpproof-common
  image: ${SHARPPROOF_TOOLING_IMAGE:-sharpproof-tooling:local}
  build:
    context: .
    dockerfile: eng/container/Dockerfile
    target: dev
    args:
      USER_UID: ${SHARPPROOF_USER_UID:-1000}
      USER_GID: ${SHARPPROOF_USER_GID:-1000}
  platform: linux/amd64
  init: true
  network_mode: bridge
  environment:
    NUGET_PACKAGES: /home/sharpproof/.nuget/packages
    DOTNET_CLI_HOME: /home/sharpproof/.dotnet
    SHARPPROOF_REPO_ROOT: /workspace/SharpProof
  volumes:
    - .:/workspace/SharpProof
    - sharpproof-nuget:/home/sharpproof/.nuget/packages
    - sharpproof-dotnet-home:/home/sharpproof/.dotnet
    - ./artifacts:/workspace/SharpProof/artifacts
  mem_limit: ${SHARPPROOF_CONTAINER_MEMORY_LIMIT:-40g}
  cpus: ${SHARPPROOF_CONTAINER_CPU_LIMIT:-16}

services:
  dev:
    <<: *sharpproof-common
    user: "${SHARPPROOF_USER_UID:-1000}:${SHARPPROOF_USER_GID:-1000}"
    environment:
      NUGET_PACKAGES: /home/sharpproof/.nuget/packages
      DOTNET_CLI_HOME: /home/sharpproof/.dotnet
      SHARPPROOF_REPO_ROOT: /workspace/SharpProof
      SHARPPROOF_ORIGIN_URL: ${SHARPPROOF_ORIGIN_URL:-https://github.com/alexyorke/SharpProof.git}
      SHARPPROOF_DEV_REF: ${SHARPPROOF_DEV_REF:-}
      SHARPPROOF_DEV_CONTAINER: "1"
    volumes:
      - sharpproof-workspace:/workspace/SharpProof
      - sharpproof-nuget:/home/sharpproof/.nuget/packages
      - sharpproof-dotnet-home:/home/sharpproof/.dotnet
    command: ["dev", "-lc", "while sleep 1000; do :; done"]

  tooling:
    <<: *sharpproof-common
    command: ["dev"]

  restore:
    <<: *sharpproof-common
    command: ["restore"]
    profiles: ["tasks"]

  build:
    <<: *sharpproof-common
    command: ["build"]
    profiles: ["tasks"]

  check:
    <<: *sharpproof-common
    command: ["check"]
    profiles: ["tests"]

  test-changed:
    <<: *sharpproof-common
    command: ["test-changed"]
    profiles: ["tests"]

  semantic-tests:
    <<: *sharpproof-common
    command: ["semantic-tests"]
    profiles: ["tests"]

  portable-tests:
    <<: *sharpproof-common
    command: ["portable-tests"]
    profiles: ["tests"]

  worker-tests:
    <<: *sharpproof-common
    command: ["worker-tests"]
    profiles: ["tests"]

  package-tests:
    <<: *sharpproof-common
    command: ["package-tests"]
    profiles: ["tests"]

  package-consumers:
    <<: *sharpproof-common
    command:
      - "package-consumers"
      - "-Configuration"
      - "Release"
      - "-PackageSource"
      - "/workspace/SharpProof/artifacts/container-packages"
    profiles: ["tests"]

  performance:
    <<: *sharpproof-common
    command: ["performance"]
    profiles: ["gates"]

  performance-smoke:
    <<: *sharpproof-common
    command: ["performance-smoke"]
    profiles: ["tests"]

  coverage:
    <<: *sharpproof-common
    command: ["coverage"]
    profiles: ["gates"]

  mutation:
    <<: *sharpproof-common
    command: ["mutation"]
    profiles: ["gates"]

  dependency-audit:
    <<: *sharpproof-common
    command: ["dependency-audit"]
    profiles: ["gates"]

  acceptance:
    <<: *sharpproof-common
    command: ["acceptance", "-Configuration", "Release"]
    profiles: ["gates"]

  pack:
    <<: *sharpproof-common
    command: ["pack", "-Configuration", "Release"]
    profiles: ["release"]

  pilots:
    <<: *sharpproof-common
    command: ["pilots", "-Configuration", "Release"]
    profiles: ["release"]

volumes:
  sharpproof-workspace:
  sharpproof-nuget:
  sharpproof-dotnet-home:
