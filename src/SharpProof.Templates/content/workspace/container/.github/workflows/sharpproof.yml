name: SharpProof
on:
  # First run: start this workflow by hand on the default branch with
  # "initialize-baseline" ticked. Once that run succeeds, uncomment the two
  # triggers below. Each later run is compared with the run for its base commit.
  # push:
  # pull_request:
  workflow_dispatch:
    inputs:
      initialize-baseline:
        description: Initialize the first baseline on the default branch
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
jobs:
  verify:
    if: ${{ github.event_name != 'push' || github.ref_name == github.event.repository.default_branch }}
    uses: alexyorke/SharpProof/.github/workflows/sharpproof-consumer.yml@__SHARPPROOF_SOURCE_REVISION__
    with:
      project: src/app/SharpProofStarter.csproj
      image: __SHARPPROOF_CONSUMER_IMAGE__
      workflow-revision: __SHARPPROOF_SOURCE_REVISION__
      caller-workflow: .github/workflows/sharpproof.yml
      compose-file: compose.yaml
      service: verify
      mode: report
      initialize-baseline: ${{ github.event_name == 'workflow_dispatch' && inputs.initialize-baseline || false }}
      registry-username: ${{ github.actor }}
      package-feed-url: https://api.nuget.org/v3/index.json
